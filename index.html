    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============ CONFIGURATION ============
        // Only the Web App URL is needed - no API key exposed!
        const CONFIG = {
            // Your deployed Google Apps Script Web App URL
            // This is safe to be public - the script controls access
            WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbyuJnhGfxj2uE1EomVOWQy0wh-h0j4S5gfPTCi7pEK6rlSoFP3eGujTGa9z-uhWJvsi/exec'
        };

        // Google Sheets API via Apps Script (secure - no API key needed)
        const SheetsAPI = {
            async request(action, sheetName, data = null) {
                if (CONFIG.WEB_APP_URL === 'YOUR_WEB_APP_URL_HERE') {
                    console.log('Web App URL not configured');
                    return null;
                }
                
                // Without a timeout a stalled Apps Script request can hang for
                // minutes before the browser gives up. Reads are abandoned after
                // 60 s (and retried by read()); writes get longer so emails can send.
                const controller = new AbortController();
                const timeoutMs = action === 'read' ? 60000 : 120000;
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                const t0 = performance.now();
                try {
                    const response = await fetch(CONFIG.WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action, sheetName, data }),
                        redirect: 'follow',
                        signal: controller.signal
                    });
                    
                    const result = await response.json();
                    console.log(`[Sheets] ${action} ${sheetName || ''}: ${((performance.now() - t0) / 1000).toFixed(1)} s`);
                    return result;
                } catch (error) {
                    const secs = ((performance.now() - t0) / 1000).toFixed(1);
                    if (error.name === 'AbortError') {
                        console.warn(`[Sheets] ${action} ${sheetName || ''} timed out after ${secs} s`);
                    } else {
                        console.error(`[Sheets] ${action} ${sheetName || ''} failed after ${secs} s:`, error);
                    }
                    return null;
                } finally {
                    clearTimeout(timer);
                }
            },
            
            async read(sheetName, attempts = 6) {
                // Apps Script sometimes returns a 404 HTML page instead of JSON.
                // Retry, and throw rather than silently returning [] so a failed
                // read never looks like an empty sheet.
                for (let i = 0; i < attempts; i++) {
                    const result = await this.request('read', sheetName);
                    if (result && Array.isArray(result.data)) return result.data;
                    // Back off a little more each time (0.5, 1, 2, 3, 4 s): the
                    // Google redirect 404s tend to come in short bursts.
                    if (i < attempts - 1) await new Promise(r => setTimeout(r, [500, 1000, 2000, 3000, 4000][i] || 4000));
                }
                throw new Error(`Failed to read ${sheetName} after ${attempts} attempts`);
            },
            
            async append(sheetName, rowData) {
                return this.request('append', sheetName, rowData);
            },
            
            async update(sheetName, allData) {
                return this.request('update', sheetName, allData);
            },
            
            async updateRow(sheetName, rowData) {
                return this.request('updateRow', sheetName, rowData);
            },
            
            async updateRows(sheetName, updates) {
                return this.request('updateRows', sheetName, { updates });
            },

            // Status updates are idempotent (setting 'Confirmed' twice is harmless),
            // so retry until the sheet confirms every row was actually found and
            // written. Returns true only on a verified write.
            async updateRowsVerified(sheetName, updates, attempts = 4) {
                for (let i = 0; i < attempts; i++) {
                    const r = await this.updateRows(sheetName, updates);
                    if (r && r.success !== false && r.updated === updates.length) return true;
                    if (r && r.success !== false && r.updated < updates.length) {
                        console.error('updateRows: some rows not found', r.notFound);
                        return false; // sheet answered: retrying won't help
                    }
                    await new Promise(res => setTimeout(res, [800, 1500, 3000][i] || 3000));
                }
                return false;
            },
            
            async deleteRow(sheetName, id) {
                return this.request('delete', sheetName, { id });
            }
        };

                </div>

        };

        // Google Sheets auto-converts a typed "09:00" into a datetime value, so
        // the API can hand back any of: "09:00" (text), an ISO/JS date string,
        // a Date, or a fraction of a day (0.375 = 09:00). Normalise all of them
        // back to "HH:MM" - this repairs rows Sheets has already rewritten, as
        // well as anything entered before the backend text-format fix.
        const toHHMM = (value) => {
            if (value === null || value === undefined || value === '') return '';

            // Already "H:MM" or "HH:MM"
            if (typeof value === 'string') {
                const plain = /^\s*(\d{1,2}):(\d{2})/.exec(value.trim());
                if (plain && !/\d{4}/.test(value.slice(0, 8))) {
                    const h = Math.min(parseInt(plain[1], 10), 23);
                    return String(h).padStart(2, '0') + ':' + plain[2];
                }
            }

            // Fraction of a day, as Sheets stores a bare time (0.375 = 09:00)
            const asNum = typeof value === 'number' ? value : NaN;
            if (!isNaN(asNum) && asNum >= 0 && asNum < 1) {
                const mins = Math.round(asNum * 24 * 60);
                return String(Math.floor(mins / 60)).padStart(2, '0') + ':' +
                       String(mins % 60).padStart(2, '0');
            }

            // Date object, or a date string like "Sat Dec 30 1899 09:00:00 GMT..."
            const d = value instanceof Date ? value : new Date(value);
            if (!isNaN(d.getTime())) {
                return String(d.getHours()).padStart(2, '0') + ':' +
                       String(d.getMinutes()).padStart(2, '0');
            }

            return '';
        };

        // A bare 'YYYY-MM-DD' parses as midnight UTC, which made a deadline
        // expire at the start of its own day. Treat it as 23:59:59 local.
        const endOfDay = (value) => {
            if (!value) return new Date(0);
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value).trim());
            if (m) return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59, 999);
            const d = new Date(value);
            if (isNaN(d)) return new Date(0);
            d.setHours(23, 59, 59, 999);
            return d;
        };

        window._SheetsAPI = SheetsAPI;

        // ====================================================================
        // Views are defined at TOP LEVEL, not inside GTAAllocator.
        // Defining a component inside another component gives it a new
        // function identity on every parent render, so React unmounts and
        // remounts it and all of its local state is lost - which is what was
        // wiping half-completed practical edits. They take a single `ctx`
        // prop carrying the shared state and handlers.
        // ====================================================================

        // Connection status banner
        const ConnectionStatus = ({ ctx }) => {
            const {
                    view, setView, isAdminAuthenticated, setIsAdminAuthenticated, isDPSAuthenticated,
                    setIsDPSAuthenticated, studentName, setStudentName, studentEmail, setStudentEmail,
                    studentExpertise, setStudentExpertise, studentMaxSessions, setStudentMaxSessions,
                    studentDepartment, setStudentDepartment, studentIsMature, setStudentIsMature, vetoList,

            if (!isConfigured) {
                return (

            return (

                            <button onClick={loadFromSheets} disabled={isLoading} className="ml-2 px-2 py-0.5 bg-white border border-red-400 rounded text-xs font-medium hover:bg-red-50 disabled:opacity-50">
                                {isLoading ? 'Retrying...' : '↻ Try again'}
                            </button>
                        </>
                    )}
                </div>
            );
        };

        const StudentView = ({ ctx }) => {
            const {
                    view, setView, isAdminAuthenticated, setIsAdminAuthenticated, isDPSAuthenticated,
                    setIsDPSAuthenticated, studentName, setStudentName, studentEmail, setStudentEmail,
                    studentExpertise, setStudentExpertise, studentMaxSessions, setStudentMaxSessions,
                    studentDepartment, setStudentDepartment, studentIsMature, setStudentIsMature, studentOpenToOthers, setStudentOpenToOthers, vetoList,
                    setVetoList, ratings, setRatings, practicals, setPracticals, preferences,
                    setPreferences, submissions, setSubmissions, allocations, setAllocations,
                    maxSlotsPerStudent, setMaxSlotsPerStudent, expertiseTags, setExpertiseTags, isLoading,
                    setIsLoading, isOnline, lastSync, isSaving, setIsSaving, isConfigured, loadFromSheets,
                    addPractical, deletePractical, updatePractical, submitPreferences, runAllocation,
                    exportAllocations, clearAllocations, clearSubmissions, clearPracticals, clearAllData,
                    confirmAllocation, declineAllocation, getAdminPassword, getDPSPassword, sessionMinutes,
                    formatHours, calculateTotalDuration, formatTime,
                    previewAllocations, previewMeta, commitAllocation, discardPreview
                } = ctx;
            const [showFirstTimePopup, setShowFirstTimePopup] = useState(false);
            
            // Check if first-time visitor (show popup once per session)
            useEffect(() => {
                try {
                    if (!window.sessionStorage.getItem('gtaPopupSeen')) {
                        setShowFirstTimePopup(true);
                    }
                } catch (e) {
                    // Private-browsing modes can throw on sessionStorage access.
                    // Showing the reminder is the safe fallback.
                    setShowFirstTimePopup(true);
                }
            }, []);
            
            const closePopup = () => {
                setShowFirstTimePopup(false);
                try { window.sessionStorage.setItem('gtaPopupSeen', 'true'); }
                catch (e) { /* non-fatal: the popup simply shows again next visit */ }

            const now = new Date();

                // Deadline day is inclusive: signup now closes at the END of the

                const deadline = endOfDay(p.deadline || p.date);
                return now < deadline;

            const checkEmail = studentEmail.toLowerCase().trim();

            return (
                <div className="max-w-4xl mx-auto p-6">
                    {/* First-time GTA Registration Popup */}
                    {showFirstTimePopup && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-lg shadow-2xl max-w-lg w-full max-h-[90vh] flex flex-col overflow-hidden">
                                <div className="bg-red-600 p-4">
                                    <h3 className="text-xl font-bold text-white flex items-center gap-2">
                                        ⚠️ You must be registered before you demonstrate
                                    </h3>
                                </div>
                                <div className="p-6 overflow-y-auto flex-1">
                                    <p className="text-gray-700 mb-3">
                                        Every GTA must be registered with the <strong>casual worker team before any session</strong>.
                                        You cannot be paid for a session you worked before your registration was in place.
                                    </p>

                                    <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
                                        <p className="font-medium text-red-800 mb-1">Registration expires after 51 weeks</p>
                                        <p className="text-sm text-red-700">
                                            If you registered at the start of last academic year, it has lapsed and you
                                            need to <strong>re-register</strong>. Re-registration is quick (a few hours
                                            to a day). A brand-new registration takes <strong>a couple of days</strong>,
                                            and can take longer at the start of term when every department is registering
                                            at once.
                                        </p>
                                    </div>

                                    <div className="bg-amber-50 border-l-4 border-amber-500 p-4 mb-4">
                                        <p className="font-medium text-amber-900 mb-1">If you are on a visa</p>
                                        <p className="text-sm text-amber-800">
                                            Your registration <strong>must</strong> be completed and confirmed before you
                                            do any session. This is not something that can be sorted out afterwards.
                                            If you are unsure how GTA work fits with the conditions of your visa, contact
                                            the International Student Support team before signing up.
                                        </p>
                                    </div>

                                    <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                                        <p className="font-medium text-yellow-800 mb-2">📧 Email Rebecca Lewis to register or re-register:</p>

                                    return (
                                        <div key={p.id} className="p-3 border rounded text-sm">
                                            <div className="font-medium">{p.name} {p.courseCode && <span className="text-purple-600">({p.courseCode})</span>}</div>
                                            <div className="text-gray-700">📅 {dateStr}{times ? ` • 🕘 ${times}` : ''}{p.location ? ` • 📍 ${p.location}` : ''}{p.teachingStaff ? ` • 👥 ${p.teachingStaff}` : ''}</div>
                                            {p.documentUrl && <a href={p.documentUrl} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline">📄 Handbook</a>}
                                        </div>
                                    );
                                })}
                                {list.length === 0 && <p className="text-gray-500 text-sm">No practicals match.</p>}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Session details for an allocated practical: time, place, staff, handbook.
        const AllocationDetails = ({ alloc, practicals, formatTime }) => {
            const p = practicals.find(x => String(x.id) === String(alloc.practicalId));
            const k = gtaDayKey(alloc.practicalDate || (p && p.date));
            const dateStr = k
                ? new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))
                    .toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })
                : '';
            const ft = (t) => (formatTime ? formatTime(t) : t);
            const times = p ? [[p.morningStart, p.morningEnd], [p.afternoonStart, p.afternoonEnd]]
                .filter(([a, b]) => a && b).map(([a, b]) => `${ft(a)}–${ft(b)}`).join(' & ') : '';
            return (
                <div className="text-sm text-gray-700 mt-1 space-y-0.5">
                    <div>
                        {alloc.courseCode && <span className="text-purple-600 font-medium">{alloc.courseCode} • </span>}
                        📅 {dateStr || 'Date TBC'}{times ? ` • 🕘 ${times}` : ''}
                    </div>
                    {p && (p.location || p.teachingStaff) && (
                        <div>
                            {p.location && <span>📍 {p.location}</span>}
                            {p.location && p.teachingStaff && ' • '}
                            {p.teachingStaff && <span>👥 {p.teachingStaff}</span>}
                        </div>
                    )}
                    {p && p.documentUrl ? (
                        <div>
                            <a href={p.documentUrl} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline font-medium">📄 View Handbook</a>
                            <span className="text-orange-600 font-medium"> (read before your practical!)</span>
                        </div>
                    ) : (
                        <div className="text-gray-500">No handbook linked yet - contact the convenor{alloc.convenorEmail ? ` (${alloc.convenorEmail})` : ''}.</div>
                    )}
                    {alloc.convenorEmail && p && p.documentUrl && <div className="text-gray-500">Convenor: {alloc.convenorEmail}</div>}
                </div>
            );
        };

        // ---- Shared timetable-clash helpers (also used by the DPS remove/replace tool)
        const gtaDayKey = (d) => {
            if (!d) return '';
            const str = String(d).trim();
            let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
            if (m) return `${m[1]}-${m[2]}-${m[3]}`;
            m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(str);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            const dt = new Date(str);
            if (isNaN(dt.getTime())) return '';
            return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        };
        const gtaSessions = (p) => {
            const toM = (t) => { const v = toHHMM(t); if (!v) return null; const [h, mm] = v.split(':').map(Number); return h * 60 + mm; };
            const out = [];
            [[p.morningStart, p.morningEnd], [p.afternoonStart, p.afternoonEnd]].forEach(([a, b]) => {
                const s1 = toM(a), e1 = toM(b);
                if (s1 !== null && e1 !== null && e1 > s1) out.push([s1, e1]);
            });
            return out.length ? out : [[0, 24 * 60]];
        };
        const gtaClash = (p1, p2) => {
            if (!p1 || !p2 || String(p1.id) === String(p2.id)) return false;
            const k1 = gtaDayKey(p1.date), k2 = gtaDayKey(p2.date);
            if (!k1 || k1 !== k2) return false;
            return gtaSessions(p1).some(([a1, b1]) => gtaSessions(p2).some(([a2, b2]) => a1 < b2 && a2 < b1));
        };
        // An allocation row that currently commits a student to turn up.
        const isActiveMain = (a) => a.isReserve !== 'Yes' && a.status !== 'Declined' && a.status !== 'Removed';

        // Per-practical cover: how many active GTAs vs slots, and who was promoted.
        const practicalCover = (practicalId, allocations, practicals) => {
            const p = practicals.find(x => String(x.id) === String(practicalId));
            const rows = allocations.filter(a => String(a.practicalId) === String(practicalId));
            const active = rows.filter(isActiveMain);
            const slots = p ? (parseInt(p.slots) || 0) : active.length;
            return {
                practical: p, slots, active: active.length, short: Math.max(0, slots - active.length),
                promoted: rows.filter(a => a.isReserve === 'Promoted' && isActiveMain(a)).map(a => a.studentName),
                reservesLeft: rows.filter(a => a.isReserve === 'Yes' && a.status !== 'Declined' && a.status !== 'Removed').length
            };
        };

        // Who could take a slot on this practical: reserves first, then anyone
        // with no clash, under their max and not vetoed for this convenor.
        const slotCandidates = (practicalId, convenorEmail, excludeEmail, ctx) => {
            const { allocations, practicals, submissions, vetoList, maxSlotsPerStudent } = ctx;
            const practical = practicals.find(p => String(p.id) === String(practicalId));
            const lc = (e) => (e || '').toLowerCase().trim();
            const latest = {};
            submissions.forEach(sub => {
                const k = lc(sub.email); if (!k) return;
                if (!latest[k] || new Date(sub.timestamp || 0) >= new Date(latest[k].timestamp || 0)) latest[k] = sub;
            });
            // every submission per student (a late sign-up is a new submission)
            const latestAll = {};
            submissions.forEach((sub, i) => { const k = lc(sub.email); if (k) (latestAll[k] = latestAll[k] || {})[i] = sub; });
            const eligibility = (email) => {
                const mine = allocations.filter(a => lc(a.studentEmail) === lc(email) && isActiveMain(a));
                if (mine.some(a => String(a.practicalId) === String(practicalId))) return 'already on this practical';
                const gone = allocations.some(a => lc(a.studentEmail) === lc(email) && String(a.practicalId) === String(practicalId) && (a.status === 'Declined' || a.status === 'Removed'));
                if (gone) return 'declined or removed from this practical';
                const sub = latest[lc(email)];
                const max = (sub && parseInt(sub.maxSessions)) || maxSlotsPerStudent;
                if (vetoList.some(v => lc(v.studentEmail) === lc(email) && lc(v.convenorEmail) === lc(convenorEmail))) return 'vetoed for this convenor';
                const clash = practical && mine.find(a => gtaClash(practical, practicals.find(p => String(p.id) === String(a.practicalId))));
                if (clash) return `clashes with ${clash.practicalName}`;
                const asked = Object.values(latestAll[lc(email)] || {}).some(sub => Array.isArray(sub.preferences) && sub.preferences.map(String).includes(String(practicalId)));
                if (mine.length >= max && !asked) return `at their max (${max})`;
                return null;
            };
            const reserves = allocations
                .filter(a => String(a.practicalId) === String(practicalId) && a.isReserve === 'Yes' && a.status !== 'Declined' && a.status !== 'Removed')
                .map(a => ({ email: a.studentEmail, name: a.studentName, reserveRow: a, why: eligibility(a.studentEmail) }));
            const reserveEmails = new Set(reserves.map(r => lc(r.email)));
            const others = Object.values(latest)
                .filter(sub => lc(sub.email) !== lc(excludeEmail) && !reserveEmails.has(lc(sub.email)))
                .map(sub => ({ email: sub.email, name: sub.name, reserveRow: null, why: eligibility(sub.email),
                               wanted: Object.values(latestAll[lc(sub.email)] || {}).some(x => Array.isArray(x.preferences) && x.preferences.map(String).includes(String(practicalId))),
                               load: allocations.filter(a => lc(a.studentEmail) === lc(sub.email) && isActiveMain(a)).length,
                               open: String(sub.openToOtherSessions || '').toLowerCase() === 'yes' }))
                .filter(o => !o.why)
                .sort((a, b) => (b.wanted - a.wanted) || (a.name || '').localeCompare(b.name || ''));
            return { reserves, others, options: [...reserves.filter(r => !r.why), ...others] };
        };

        // Upcoming practicals that still need GTAs (from tomorrow onwards).
        const openSlotList = (practicals, allocations) => {
            const today = gtaDayKey(new Date());
            return practicals
                .filter(p => gtaDayKey(p.date) > today)
                .map(p => ({ p, ...practicalCover(p.id, allocations, practicals) }))
                .filter(x => x.short > 0)
                .sort((a, b) => gtaDayKey(a.p.date).localeCompare(gtaDayKey(b.p.date)));
        };

        // "Open GTA slots" page: registered GTAs can claim a place directly.
        const VacanciesView = ({ ctx }) => {
            const { practicals, allocations, submissions, formatTime, loadFromSheets, isConfigured, isOnline, isLoading } = ctx;
            const [email, setEmail] = React.useState('');
            const [busyId, setBusyId] = React.useState(null);
            const [notice, setNotice] = React.useState(null);
            const lc = (e) => (e || '').toLowerCase().trim();
            const ft = (t) => (formatTime ? formatTime(t) : t);
            const list = openSlotList(practicals, allocations);
            const registered = email && submissions.some(sub => lc(sub.email) === lc(email));
            const mine = allocations.filter(a => lc(a.studentEmail) === lc(email) && isActiveMain(a));
            const todayKey = gtaDayKey(new Date());
            const in7 = gtaDayKey(new Date(Date.now() + 7 * 864e5));

            const claim = async (p) => {
                if (!confirm(`Volunteer for "${p.name}"?\n\nYou'll be confirmed straight away and the convenor will be told. You must be registered with the casual worker team before the session.`)) return;
                setBusyId(p.id); setNotice(null);
                let r = null;
                for (let i = 0; i < 3 && !r; i++) {
                    r = await SheetsAPI.request('claimSlot', 'Allocations', { email: email.trim(), practicalId: String(p.id) });
                    if (!r) await new Promise(res => setTimeout(res, 1500));
                }
                setBusyId(null);
                if (r && r.success) {
                    setNotice({ ok: true, text: r.already ? `You're already on "${p.name}".` : `✓ You're confirmed for "${p.name}". A confirmation email with the details is on its way.` });
                    await loadFromSheets();
                } else {
                    setNotice({ ok: false, text: (r && r.error) || 'Could not reach Google just now - please try again in a minute.' });
                    if (r && r.code === 'full') await loadFromSheets();
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 mb-1">Open GTA slots</h2>
                        <p className="text-gray-600 text-sm mb-4">
                            These sessions still need GTAs. If you're a registered GTA, enter the email you signed up with and volunteer for any session that suits you - you'll be confirmed straight away.
                        </p>
                        <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                               placeholder="Your Imperial email (the one you registered with)"
                               className="w-full p-2 border rounded" />
                        {email && !registered && submissions.length > 0 && (
                            <p className="text-sm text-amber-700 mt-2">We don't have a GTA registration for that email yet. Please submit your details in <strong>Student View</strong> first, then come back here.</p>
                        )}
                        {registered && <p className="text-sm text-green-700 mt-2">✓ Registered GTA{mine.length ? ` - you currently have ${mine.length} session${mine.length !== 1 ? 's' : ''}` : ''}.</p>}
                        <p className="text-xs text-red-700 mt-3">You must be registered with the casual worker team before your first session (email rebecca.lewis1@imperial.ac.uk). On a visa? This must be confirmed before you demonstrate.</p>
                    </div>

                    {notice && (
                        <div className={`mb-4 p-3 rounded border text-sm ${notice.ok ? 'bg-green-50 border-green-300 text-green-800' : 'bg-red-50 border-red-300 text-red-800'}`}>{notice.text}</div>
                    )}
                    {isConfigured && !isOnline && (
                        <div className="mb-4 p-3 rounded border bg-red-50 border-red-300 text-sm text-red-800">
                            Session data couldn't be loaded just now. <button onClick={loadFromSheets} disabled={isLoading} className="ml-2 px-2 py-0.5 bg-white border border-red-400 rounded text-xs">{isLoading ? 'Retrying...' : '↻ Try again'}</button>
                        </div>
                    )}

                    {list.length === 0 ? (
                        <div className="bg-green-50 border border-green-300 rounded-lg p-6 text-green-800">All upcoming sessions currently have their GTAs. Thank you!</div>
                    ) : (
                        <div className="space-y-3">
                            {list.map(({ p, short, slots, active }) => {
                                const k = gtaDayKey(p.date);
                                const dateStr = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
                                const times = [[p.morningStart, p.morningEnd], [p.afternoonStart, p.afternoonEnd]].filter(([a, b]) => a && b).map(([a, b]) => `${ft(a)}–${ft(b)}`).join(' & ');
                                const onIt = mine.some(a => String(a.practicalId) === String(p.id));
                                const clash = !onIt && mine.find(a => gtaClash(p, practicals.find(x => String(x.id) === String(a.practicalId))));
                                const urgent = k <= in7;
                                return (
                                    <div key={p.id} className={`bg-white rounded-lg shadow p-4 border-l-4 ${urgent ? 'border-red-500' : 'border-amber-400'}`}>
                                        <div className="flex flex-wrap justify-between gap-3">
                                            <div className="flex-1 min-w-[240px]">
                                                <div className="font-semibold text-gray-900">{p.name} {p.courseCode && <span className="text-purple-600 font-normal">({p.courseCode})</span>}</div>
                                                <div className="text-sm text-gray-700">📅 {dateStr}{times ? ` • 🕘 ${times}` : ''}</div>
                                                <div className="text-sm text-gray-700">{p.location ? `📍 ${p.location}` : ''}{p.location && p.teachingStaff ? ' • ' : ''}{p.teachingStaff ? `👥 ${p.teachingStaff}` : ''}</div>
                                                {p.documentUrl && <a href={p.documentUrl} target="_blank" rel="noopener noreferrer" className="text-sm text-blue-600 hover:underline">📄 Handbook</a>}
                                            </div>
                                            <div className="text-right">
                                                <div className={`text-sm font-bold ${urgent ? 'text-red-700' : 'text-amber-700'}`}>{short} GTA{short !== 1 ? 's' : ''} needed{urgent ? ' - this week' : ''}</div>
                                                <div className="text-xs text-gray-500 mb-2">{active} of {slots} filled</div>
                                                {onIt ? (
                                                    <span className="text-sm text-green-700">✓ You're on this</span>
                                                ) : clash ? (
                                                    <span className="text-xs text-gray-500">Clashes with your {clash.practicalName}</span>
                                                ) : (
                                                    <button onClick={() => claim(p)} disabled={!registered || busyId !== null}
                                                            title={registered ? '' : 'Enter your registered email above first'}
                                                            className="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-green-700 disabled:opacity-40">
                                                        {busyId === p.id ? 'Saving...' : 'Volunteer'}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // DPS tool: fill an empty slot on a practical that is short.
        const FillSlotControl = ({ practicalId, ctx, label }) => {
            const { allocations, practicals, fillSlot, isSaving } = ctx;
            const [open, setOpen] = React.useState(false);
            const [choice, setChoice] = React.useState('');
            const [msg, setMsg] = React.useState('');
            const p = practicals.find(x => String(x.id) === String(practicalId));
            if (!p) return null;
            const { reserves, others, options } = slotCandidates(practicalId, p.convenorEmail, null, ctx);

            if (msg) return <span className="ml-2 text-xs text-green-700">{msg}</span>;
            if (!open) {
                return (
                    <button onClick={() => setOpen(true)} className="ml-2 px-2 py-0.5 bg-amber-600 text-white rounded text-xs hover:bg-amber-700">
                        {label || 'Fill slot'}
                    </button>
                );
            }
            return (
                <div className="mt-2 p-3 bg-white border border-amber-300 rounded text-sm space-y-2">
                    <label className="block text-xs font-medium">Give a slot on {p.name} to</label>
                    <select value={choice} onChange={e => setChoice(e.target.value)} className="w-full p-2 border rounded text-sm">
                        <option value="">Choose a student…</option>
                        {reserves.filter(r => !r.why).length > 0 && (
                            <optgroup label="Reserves for this practical">
                                {reserves.filter(r => !r.why).map(r => <option key={r.email} value={r.email}>{r.name} (reserve)</option>)}
                            </optgroup>
                        )}
                        {others.length > 0 && (
                            <optgroup label="Other available students (no clash, under their max)">
                                {others.map(o => <option key={o.email} value={o.email}>{o.wanted ? '★ ' : ''}{o.name}{o.wanted ? ' (signed up for this)' : o.open ? ' (happy to take other sessions)' : ' (did NOT choose this)'} - {o.load} session{o.load !== 1 ? 's' : ''} so far</option>)}
                            </optgroup>
                        )}
                    </select>
                    {options.length === 0 && <p className="text-xs text-red-700">Nobody is currently available without a clash or going over their max.</p>}
                    {reserves.filter(r => r.why).length > 0 && (
                        <p className="text-xs text-gray-500">Reserves not offered: {reserves.filter(r => r.why).map(r => `${r.name} (${r.why})`).join('; ')}</p>
                    )}
                    <div className="flex gap-2">
                        <button disabled={!choice || isSaving} onClick={async () => {
                            const pick = options.find(o => o.email === choice);
                            if (!pick || !confirm(`Give ${pick.name} a slot on "${p.name}"?\n\n${pick.name} and the convenor will be emailed automatically.`)) return;
                            const r = await fillSlot(p, pick);
                            if (r) setMsg(r);
                        }} className="bg-amber-600 text-white px-3 py-1 rounded text-xs hover:bg-amber-700 disabled:opacity-50">
                            {isSaving ? 'Saving...' : 'Confirm'}
                        </button>
                        <button onClick={() => setOpen(false)} className="px-3 py-1 border rounded text-xs">Cancel</button>
                    </div>
                </div>
            );
        };

        // DPS tool: remove a GTA from a practical, optionally replacing them.
        const ReassignControl = ({ alloc, ctx }) => {
            const { allocations, practicals, submissions, vetoList, maxSlotsPerStudent, reassignAllocation, isSaving } = ctx;
            const [open, setOpen] = React.useState(false);
            const [choice, setChoice] = React.useState('');
            const [reason, setReason] = React.useState('');
            const [done, setDone] = React.useState(null);

            if (!isActiveMain(alloc)) return null;

            const { reserves, others, options } = slotCandidates(alloc.practicalId, alloc.convenorEmail, alloc.studentEmail, ctx);

            const submit = async () => {
                const replacement = options.find(o => o.email === choice) || null;
                const msg = replacement
                    ? `Remove ${alloc.studentName} from "${alloc.practicalName}" and replace with ${replacement.name}?\n\n${replacement.name}, ${alloc.studentName} and the convenor will be emailed automatically.`
                    : `Remove ${alloc.studentName} from "${alloc.practicalName}" and leave the slot empty?\n\n${alloc.studentName} and the convenor will be emailed automatically.`;
                if (!confirm(msg)) return;
                const result = await reassignAllocation(alloc, replacement, reason.trim());
                if (result) { setDone(result); }
            };

            if (done) {
                return (
                    <div className="mt-2 p-3 bg-white border border-blue-300 rounded text-sm">
                        {done.autoEmailed ? (
                            <p className="font-medium text-blue-800 mb-2">✓ Saved. {alloc.studentName}, the convenor{done.replacementName ? ` and ${done.replacementName}` : ''} have been emailed automatically.</p>
                        ) : (
                            <p className="font-medium text-blue-800 mb-2">✓ Saved. {done.replacementName ? `${done.replacementName} has been emailed.` : ''} The automatic emails to the convenor and {alloc.studentName} didn't go through, so please send these drafts:</p>
                        )}
                        <div className="flex flex-wrap gap-2">
                            {!done.autoEmailed && done.convenorMailto && <a href={done.convenorMailto} className="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700">✉️ Email convenor</a>}
                            {!done.autoEmailed && <a href={done.studentMailto} className="bg-blue-600 text-white px-3 py-1 rounded text-xs hover:bg-blue-700">✉️ Email {alloc.studentName}</a>}
                            <button onClick={() => { setDone(null); setOpen(false); }} className="px-3 py-1 border rounded text-xs">Close</button>
                        </div>
                        {!done.autoEmailed && <p className="text-xs text-gray-500 mt-2">These open a pre-written draft in your mail app for you to check and send.</p>}
                    </div>
                );
            }

            if (!open) {
                return (
                    <button onClick={() => setOpen(true)} className="ml-2 px-2 py-0.5 border border-gray-400 rounded text-xs hover:bg-gray-100">
                        Remove / replace
                    </button>
                );
            }

            return (
                <div className="mt-2 p-3 bg-white border border-gray-300 rounded text-sm space-y-2">
                    <div>
                        <label className="block text-xs font-medium mb-1">Replace {alloc.studentName} with</label>
                        <select value={choice} onChange={e => setChoice(e.target.value)} className="w-full p-2 border rounded text-sm">
                            <option value="">No replacement - leave the slot empty</option>
                            {reserves.filter(r => !r.why).length > 0 && (
                                <optgroup label="Reserves for this practical">
                                    {reserves.filter(r => !r.why).map(r => <option key={r.email} value={r.email}>{r.name} (reserve)</option>)}
                                </optgroup>
                            )}
                            {others.length > 0 && (
                                <optgroup label="Other available students (no clash, under their max)">
                                    {others.map(o => <option key={o.email} value={o.email}>{o.wanted ? '★ ' : ''}{o.name}{o.wanted ? ' (signed up for this)' : o.open ? ' (happy to take other sessions)' : ' (did NOT choose this)'} - {o.load} session{o.load !== 1 ? 's' : ''} so far</option>)}
                                </optgroup>
                            )}
                        </select>
                        {reserves.filter(r => r.why).length > 0 && (
                            <p className="text-xs text-gray-500 mt-1">
                                Reserves not offered: {reserves.filter(r => r.why).map(r => `${r.name} (${r.why})`).join('; ')}
                            </p>
                        )}
                    </div>
                    <div>
                        <label className="block text-xs font-medium mb-1">Reason (optional, goes in the email drafts)</label>
                        <input value={reason} onChange={e => setReason(e.target.value)} className="w-full p-2 border rounded text-sm" placeholder="e.g. too many sessions this term" />
                    </div>
                    <div className="flex gap-2">
                        <button onClick={submit} disabled={isSaving} className="bg-red-600 text-white px-3 py-1 rounded text-xs hover:bg-red-700 disabled:opacity-50">
                            {isSaving ? 'Saving...' : 'Confirm change'}
                        </button>
                        <button onClick={() => setOpen(false)} className="px-3 py-1 border rounded text-xs">Cancel</button>
                    </div>
                </div>
            );
        };

        const DPSTools = ({ ctx }) => {
            const {
                    view, setView, isAdminAuthenticated, setIsAdminAuthenticated, isDPSAuthenticated,
                    setIsDPSAuthenticated, studentName, setStudentName, studentEmail, setStudentEmail,
                    studentExpertise, setStudentExpertise, studentMaxSessions, setStudentMaxSessions,
                    studentDepartment, setStudentDepartment, studentIsMature, setStudentIsMature, vetoList,
                    setVetoList, ratings, setRatings, practicals, setPracticals, preferences,
                    setPreferences, submissions, setSubmissions, allocations, setAllocations,
                    maxSlotsPerStudent, setMaxSlotsPerStudent, expertiseTags, setExpertiseTags, isLoading,

                    addPractical, deletePractical, updatePractical, submitPreferences, runAllocation,

                                        </div>

                                })}
                            </div>
                        </div>

                    <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                        <h3 className="text-xl font-semibold mb-4">Run Allocation</h3>

                                <div>
                                    <p className="font-medium text-amber-800">Before running the allocation:</p>
                                    <ul className="text-sm text-amber-700 mt-1 list-disc list-inside">

                                    </ul>
                                </div>
                            </div>

                        {(() => {
                            // The allocator runs over EVERY practical in the sheet.

                            // students allocated to them, so surface them here.
                            const today = new Date(); today.setHours(0, 0, 0, 0);
                            const stale = practicals.filter(p => p.date && new Date(p.date) < today);
                            if (stale.length === 0) return null;
                            return (
                                <div className="bg-orange-50 border border-orange-300 rounded-lg p-4 mb-4">
                                    <p className="font-medium text-orange-800">
                                        ⚠️ {stale.length} practical{stale.length !== 1 ? 's have' : ' has'} a date in the past
                                    </p>
                                    <p className="text-sm text-orange-700 mt-1">
                                        The allocation runs over every practical in the sheet, including these.
                                        Delete any left over from a previous term before running, or students
                                        will be allocated to them.
                                    </p>
                                    <ul className="text-xs text-orange-700 mt-2 list-disc list-inside max-h-24 overflow-y-auto">
                                        {stale.map(p => (
                                            <li key={p.id}>{p.name} — {new Date(p.date).toLocaleDateString()}</li>
                                        ))}

                                </div>

                        <p className="text-gray-600 mb-2">

                        </p>

                        </p>
                        <button
                            onClick={runAllocation}

                            className="bg-green-600 text-white px-6 py-3 rounded font-medium hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            {isSaving ? 'Running...' : '🔍 Preview Allocation (nothing saved)'}
                        </button>

                        {previewAllocations && (() => {
                            const main = previewAllocations.filter(r => r.isReserve === 'No');
                            const reserves = previewAllocations.filter(r => r.isReserve === 'Yes');
                            const firstChoice = main.filter(r => r.preferenceRank === 1).length;
                            const autoAssigned = main.filter(r => r.preferenceRank === 99).length;
                            const parseD = (d) => {
                                if (!d) return 0;
                                const m = String(d).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                                const t = m ? new Date(+m[3], +m[2] - 1, +m[1]).getTime() : new Date(d).getTime();
                                return isNaN(t) ? 0 : t;
                            };
                            const fmtD = (d) => { const t = parseD(d); return t ? new Date(t).toLocaleDateString('en-GB') : (d || ''); };
                            const coverage = practicals.map(p => {
                                const filled = main.filter(r => String(r.practicalId) === String(p.id)).length;
                                const total = parseInt(p.slots) || 0;
                                const times = [[p.morningStart, p.morningEnd], [p.afternoonStart, p.afternoonEnd]]
                                    .filter(([a, b]) => a && b).map(([a, b]) => `${a}–${b}`).join(' & ');
                                return { id: p.id, name: p.name, date: p.date, times, course: p.courseCode || '', convenor: p.convenorEmail || '', filled, total, short: total - filled, clashSkips: (previewMeta?.blockedByClash || {})[p.id] || 0 };
                            });
                            const unfilled = coverage.filter(x => x.short > 0).sort((a, b) => parseD(a.date) - parseD(b.date));
                            const totalSlots = coverage.reduce((n, x) => n + x.total, 0);
                            const totalShort = unfilled.reduce((n, x) => n + x.short, 0);
                            return (
                                <div className="mt-6 border-2 border-blue-400 rounded-lg overflow-hidden">
                                    <div className="bg-blue-600 text-white px-4 py-2 flex justify-between items-center">
                                        <span className="font-semibold">Preview — not yet saved</span>
                                        <span className="text-xs opacity-90">
                                            generated {previewMeta?.generatedAt ? previewMeta.generatedAt.toLocaleTimeString() : ''}
                                        </span>
                                    </div>
                                    <div className="p-4 bg-blue-50">
                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                            <div>
                                                <div className="text-2xl font-bold text-blue-700">{main.length}</div>
                                                <div className="text-xs text-gray-600">Main slots filled</div>
                                            </div>
                                            <div>
                                                <div className="text-2xl font-bold text-orange-600">{reserves.length}</div>
                                                <div className="text-xs text-gray-600">Reserve slots</div>
                                            </div>
                                            <div>
                                                <div className="text-2xl font-bold text-green-600">
                                                    {main.length ? Math.round(firstChoice / main.length * 100) : 0}%

                                                <div className="text-xs text-gray-600">Got 1st choice</div>
                                            </div>
                                            <div>
                                                <div className="text-2xl font-bold text-purple-600">{autoAssigned}</div>
                                                <div className="text-xs text-gray-600">Auto-assigned (no preference)</div>
                                            </div>
                                        </div>

                                        {previewMeta?.duplicateCount > 0 && (
                                            <p className="text-sm text-gray-700 mb-2">
                                                {previewMeta.duplicateCount} duplicate submission(s) ignored — only each
                                                student's most recent entry was used.
                                            </p>
                                        )}

                                        <div className="text-sm mb-3 text-gray-700">
                                            Timetable clashes avoided: <span className="font-semibold">{previewMeta?.clashesAvoided || 0}</span>
                                            {' '}(students skipped for a session because it overlapped one they already had).
                                        </div>
                                        {previewMeta?.remainingClashes?.length > 0 && (
                                            <div className="bg-red-50 border border-red-300 rounded p-3 mb-3 text-sm text-red-800">

                                                <ul className="list-disc list-inside">
                                                    {previewMeta.remainingClashes.map((c, i) => (
                                                        <li key={i}>{c.student}: {c.a} and {c.b} ({fmtD(c.date)})</li>
                                                    ))}
                                                </ul>
                                            </div>
                                        )}
                                        {unfilled.length === 0 ? (
                                            <div className="bg-green-50 border border-green-300 rounded p-3 mb-3 text-sm text-green-800">
                                                ✓ All {totalSlots} slots across {coverage.length} practicals are filled.
                                            </div>
                                        ) : (
                                            <div className="bg-amber-50 border border-amber-300 rounded p-3 mb-3 text-sm">
                                                <p className="font-medium text-amber-800 mb-2">
                                                    ⚠️ {totalShort} of {totalSlots} slots unfilled across {unfilled.length} practical{unfilled.length !== 1 ? 's' : ''}

                                                                <th className="text-left p-2">Practical</th>
                                                                <th className="text-left p-2">Course</th>
                                                                <th className="text-left p-2">Convenor</th>
                                                                <th className="text-right p-2">Filled</th>
                                                                <th className="text-right p-2">Unfilled</th>
                                                                <th className="text-right p-2" title="Students who would have been placed here but already had a clashing session">Clash skips</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {unfilled.map(u => (
                                                                <tr key={u.id} className="border-t border-amber-100">
                                                                    <td className="p-2 whitespace-nowrap">{fmtD(u.date)}</td>
                                                                    <td className="p-2 whitespace-nowrap">{u.times || 'all day'}</td>
                                                                    <td className="p-2">{u.name}</td>
                                                                    <td className="p-2">{u.course}</td>
                                                                    <td className="p-2">{u.convenor}</td>
                                                                    <td className="p-2 text-right">{u.filled}/{u.total}</td>
                                                                    <td className="p-2 text-right font-semibold text-amber-800">{u.short}</td>

                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        )}

                                        <div className="max-h-64 overflow-y-auto bg-white rounded border">
                                            <table className="w-full text-sm">
                                                <thead className="bg-gray-100 sticky top-0">
                                                    <tr>
                                                        <th className="text-left p-2">Student</th>
                                                        <th className="text-left p-2">Practical</th>
                                                        <th className="text-left p-2">Date</th>
                                                        <th className="text-left p-2">Rank</th>
                                                        <th className="text-left p-2">Type</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {previewAllocations.map((r, i) => (
                                                        <tr key={i} className={i % 2 ? 'bg-gray-50' : ''}>
                                                            <td className="p-2">{r.studentName}</td>
                                                            <td className="p-2">{r.practicalName}</td>
                                                            <td className="p-2">{r.practicalDate ? new Date(r.practicalDate).toLocaleDateString() : ''}</td>

                                                            <td className="p-2">
                                                                {r.isReserve === 'Yes'
                                                                    ? <span className="text-orange-600">Reserve</span>

                                                                        ? <span className="text-purple-600">Auto</span>

                                                        </tr>

                                                {isSaving ? 'Saving...' : '✓ Save & Notify Convenors'}

                                        <p className="text-xs text-gray-600 mt-2">
                                            Saving replaces the Allocations sheet, emails convenors, and sends
                                            the registration contacts the list of allocated students to check.
                                            Students themselves are emailed separately, below.
                                        </p>
                                    </div>
                                </div>
                            );
                        })()}
                        
                        {allocations.length > 0 && (() => {
                            const unemailedCount = allocations.filter(a => a.isReserve !== 'Yes' && !a.status).length;
                            return (
                            <span className="inline-block">
                                {unemailedCount > 0 && (
                                    <div className="ml-0 mt-3 mb-1 inline-flex items-center gap-2 bg-amber-100 border border-amber-400 text-amber-800 text-sm font-medium px-3 py-2 rounded animate-pulse">

                                        setIsSaving(false);

                                            alert(`Sent ${result.emailsSent} allocation email(s) to students.`);

                                        setIsSaving(true);

                                        else alert('Not sent: ' + ((r && r.error) || 'no response from Google Sheets'));
                                    }}

                                            alert(`Sent ${r.emailsSent} convenor email(s).`);

                                            alert(`Sent ${r.emailsSent} convenor email(s), but some failed: ${(r.failed || []).join(', ')}`);
                                        } else {
                                            alert('Convenor emails were not sent: ' + ((r && r.error) || 'no response from Google Sheets') + '. Nothing has changed - you can try again.');
                                        }
                                    }}
                                    disabled={isSaving}
                                    className="ml-2 bg-white border border-blue-600 text-blue-700 px-4 py-3 rounded font-medium hover:bg-blue-50 disabled:opacity-50"
                                >
                                    📨 Resend convenor emails
                                </button>
                            </span>
                            );
                        })()}
                    </div>

                    {allocations.length > 0 && (
                        <div className="bg-white rounded-lg shadow-md p-6">

                                    className="flex items-center bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                                >
                                    <Download size={20} className="mr-2" />
                                    Export CSV
                                </button>
                            </div>
                            
                            <div className="grid grid-cols-4 gap-4 mb-4 p-4 bg-gray-50 rounded">
                                <div>
                                    <div className="text-2xl font-bold text-blue-600">
                                        {new Set(allocations.filter(a => a.isReserve !== 'Yes').map(a => a.studentEmail)).size}
                                    </div>
                                    <div className="text-sm text-gray-600">Students allocated</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-orange-600">
                                        {new Set(allocations.filter(a => a.isReserve === 'Yes').map(a => a.studentEmail)).size}
                                    </div>
                                    <div className="text-sm text-gray-600">Reserve students</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-green-600">
                                        {allocations.filter(a => a.isReserve !== 'Yes').length > 0 ? (allocations.filter(a => a.isReserve !== 'Yes').reduce((sum, a) => sum + (a.preferenceRank === 1 ? 1 : 0), 0) / allocations.filter(a => a.isReserve !== 'Yes').length * 100).toFixed(0) : 0}%
                                    </div>
                                    <div className="text-sm text-gray-600">Got 1st choice</div>
                                </div>
                                <div>
                                    <div className="text-2xl font-bold text-purple-600">
                                        {submissions.length > 0 ? (allocations.filter(a => a.isReserve !== 'Yes').length / submissions.length).toFixed(1) : 0}
                                    </div>
                                    <div className="text-sm text-gray-600">Avg slots per student</div>
                                </div>
                            </div>

                            {(() => {
                                const ids = [...new Set([...allocations.map(a => String(a.practicalId)),
                                    ...practicals.filter(p => gtaDayKey(p.date) >= gtaDayKey(new Date())).map(p => String(p.id))])];
                                const gaps = ids.map(id => ({ id, ...practicalCover(id, allocations, practicals) }))
                                    .filter(g => g.short > 0 && g.practical)
                                    .sort((a, b) => gtaDayKey(a.practical.date).localeCompare(gtaDayKey(b.practical.date)));
                                if (!gaps.length) return (
                                    <div className="mb-4 p-3 bg-green-50 border border-green-300 rounded text-sm text-green-800">
                                        ✓ Every upcoming practical has its full number of active GTAs.
                                    </div>
                                );
                                return (
                                    <div className="mb-4 p-3 bg-amber-50 border border-amber-300 rounded text-sm">
                                        <p className="font-medium text-amber-800 mb-2">⚠️ {gaps.length} practical{gaps.length !== 1 ? 's are' : ' is'} short of GTAs (declines, removals, or practicals added after the allocation):</p>
                                        <div className="space-y-2">
                                            {gaps.map(g => (
                                                <div key={g.id} className="text-amber-900">
                                                    <span className="font-medium">{g.practical.name}</span>
                                                    {' '}({new Date(+gtaDayKey(g.practical.date).slice(0,4), +gtaDayKey(g.practical.date).slice(5,7)-1, +gtaDayKey(g.practical.date).slice(8,10)).toLocaleDateString('en-GB')})
                                                    {' '}- {g.active}/{g.slots} GTAs{g.reservesLeft === 0 ? ', no reserves left' : `, ${g.reservesLeft} reserve${g.reservesLeft !== 1 ? 's' : ''} left`}
                                                    <FillSlotControl practicalId={g.id} ctx={ctx} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );

                            <div className="space-y-2 max-h-96 overflow-y-auto">
                                {allocations.map((alloc, idx) => (
                                    <div key={idx} className={`p-3 border rounded ${
                                        alloc.status === 'Declined' || alloc.status === 'Removed' ? 'bg-red-50 border-red-200' :
                                        alloc.status === 'Confirmed' ? 'bg-green-100 border-green-400' :
                                        alloc.isReserve === 'Yes' ? 'bg-orange-50 border-orange-200' : 
                                        alloc.isReserve === 'Promoted' ? 'bg-blue-50 border-blue-200' :
                                        'bg-green-50 border-green-200'
                                    }`}>
                                        <div className="flex justify-between">
                                            <div>
                                                {alloc.isReserve === 'Yes' && <span className="text-orange-600 font-medium mr-2">[RESERVE]</span>}

                                                    Pref #{alloc.preferenceRank} {alloc.isReserve !== 'Yes' && alloc.isReserve !== 'Promoted' && `• R${alloc.round}`}

                                                {(alloc.status === 'Declined' || alloc.status === 'Removed') && alloc.isReserve !== 'Yes' && (() => {

                                                        return <span className="ml-2 text-xs bg-green-100 text-green-800 px-2 py-0.5 rounded">✓ Covered{cv.promoted.length ? ` - promoted: ${cv.promoted.join(', ')}` : ''}</span>;
                                                    }
