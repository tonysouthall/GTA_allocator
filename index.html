    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============ CONFIGURATION ============
        // Only the Web App URL is needed - no API key exposed!
        const CONFIG = {
            // Your deployed Google Apps Script Web App URL
            // This is safe to be public - the script controls access
            WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbyuJnhGfxj2uE1EomVOWQy0wh-h0j4S5gfPTCi7pEK6rlSoFP3eGujTGa9z-uhWJvsi/exec'
        };

        // Google Sheets API via Apps Script (secure - no API key needed)
        const SheetsAPI = {
            async request(action, sheetName, data = null) {
                if (CONFIG.WEB_APP_URL === 'YOUR_WEB_APP_URL_HERE') {
                    console.log('Web App URL not configured');
                    return null;
                }
                
                try {
                    const response = await fetch(CONFIG.WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action, sheetName, data }),
                        redirect: 'follow'
                    });
                    
                    const result = await response.json();
                    return result;
                } catch (error) {
                    console.error('API Error:', error);
                    return null;
                }
            },
            
            async read(sheetName) {
                const result = await this.request('read', sheetName);
                return result?.data || [];
            },
            
            async append(sheetName, rowData) {
                return this.request('append', sheetName, rowData);
            },
            
            async update(sheetName, allData) {
                return this.request('update', sheetName, allData);
            },
            
            async updateRow(sheetName, rowData) {
                return this.request('updateRow', sheetName, rowData);
            },
            
            async updateRows(sheetName, updates) {
                return this.request('updateRows', sheetName, { updates });
            },
            
            async deleteRow(sheetName, id) {
                return this.request('delete', sheetName, { id });
            }
        };

        // Google Sheets auto-converts a typed "09:00" into a datetime value, so
        // the API can hand back any of: "09:00" (text), an ISO/JS date string,
        // a Date, or a fraction of a day (0.375 = 09:00). Normalise all of them
        // back to "HH:MM" - this repairs rows Sheets has already rewritten, as
        // well as anything entered before the backend text-format fix.
        const toHHMM = (value) => {
            if (value === null || value === undefined || value === '') return '';

            // Already "H:MM" or "HH:MM"
            if (typeof value === 'string') {
                const plain = /^\s*(\d{1,2}):(\d{2})/.exec(value.trim());
                if (plain && !/\d{4}/.test(value.slice(0, 8))) {
                    const h = Math.min(parseInt(plain[1], 10), 23);
                    return String(h).padStart(2, '0') + ':' + plain[2];
                }
            }

            // Fraction of a day, as Sheets stores a bare time (0.375 = 09:00)
            const asNum = typeof value === 'number' ? value : NaN;
            if (!isNaN(asNum) && asNum >= 0 && asNum < 1) {
                const mins = Math.round(asNum * 24 * 60);
                return String(Math.floor(mins / 60)).padStart(2, '0') + ':' +
                       String(mins % 60).padStart(2, '0');
            }

            // Date object, or a date string like "Sat Dec 30 1899 09:00:00 GMT..."
            const d = value instanceof Date ? value : new Date(value);
            if (!isNaN(d.getTime())) {
                return String(d.getHours()).padStart(2, '0') + ':' +
                       String(d.getMinutes()).padStart(2, '0');
            }

            return '';
        };

        // A bare 'YYYY-MM-DD' parses as midnight UTC, which made a deadline
        // expire at the start of its own day. Treat it as 23:59:59 local.
        const endOfDay = (value) => {
            if (!value) return new Date(0);
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value).trim());
            if (m) return new Date(+m[1], +m[2] - 1, +m[3], 23, 59, 59, 999);
            const d = new Date(value);
            if (isNaN(d)) return new Date(0);
            d.setHours(23, 59, 59, 999);
            return d;
        };

        window._SheetsAPI = SheetsAPI;

        // ====================================================================
        // Views are defined at TOP LEVEL, not inside GTAAllocator.
        // Defining a component inside another component gives it a new
        // function identity on every parent render, so React unmounts and
        // remounts it and all of its local state is lost - which is what was
        // wiping half-completed practical edits. They take a single `ctx`
        // prop carrying the shared state and handlers.
        // ====================================================================

        // Connection status banner
        const ConnectionStatus = ({ ctx }) => {
            const {
                    view, setView, isAdminAuthenticated, setIsAdminAuthenticated, isDPSAuthenticated,
                    setIsDPSAuthenticated, studentName, setStudentName, studentEmail, setStudentEmail,
                    studentExpertise, setStudentExpertise, studentMaxSessions, setStudentMaxSessions,
                    studentDepartment, setStudentDepartment, studentIsMature, setStudentIsMature, vetoList,
                    setVetoList, ratings, setRatings, practicals, setPracticals, preferences,

                    confirmAllocation, declineAllocation, getAdminPassword, getDPSPassword, sessionMinutes,

        const StudentView = ({ ctx }) => {

                    studentExpertise, setStudentExpertise, studentMaxSessions, setStudentMaxSessions,
                    studentDepartment, setStudentDepartment, studentIsMature, setStudentIsMature, vetoList,
                    setVetoList, ratings, setRatings, practicals, setPracticals, preferences,
                    setPreferences, submissions, setSubmissions, allocations, setAllocations,
                    maxSlotsPerStudent, setMaxSlotsPerStudent, expertiseTags, setExpertiseTags, isLoading,
                    setIsLoading, isOnline, lastSync, isSaving, setIsSaving, isConfigured, loadFromSheets,
                    addPractical, deletePractical, updatePractical, submitPreferences, runAllocation,
                    exportAllocations, clearAllocations, clearSubmissions, clearPracticals, clearAllData,
                    confirmAllocation, declineAllocation, getAdminPassword, getDPSPassword, sessionMinutes,
                    formatHours, calculateTotalDuration, formatTime,
                    previewAllocations, previewMeta, commitAllocation, discardPreview
                } = ctx;
            const [showFirstTimePopup, setShowFirstTimePopup] = useState(false);
            
            // Check if first-time visitor (show popup once per session)
            useEffect(() => {

                    if (!window.sessionStorage.getItem('gtaPopupSeen')) {

                    // Private-browsing modes can throw on sessionStorage access.

            const closePopup = () => {
                setShowFirstTimePopup(false);
                try { window.sessionStorage.setItem('gtaPopupSeen', 'true'); }
                catch (e) { /* non-fatal: the popup simply shows again next visit */ }

            const now = new Date();

                                            to a day). A brand-new registration takes <strong>a couple of days</strong>,

                                            the International Student Support team before signing up.
                                        </p>
                                    </div>

                                    <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-4">
                                        <p className="font-medium text-yellow-800 mb-2">📧 Email Rebecca Lewis to register or re-register:</p>
                                        <a href="mailto:rebecca.lewis1@imperial.ac.uk?subject=GTA%20Registration%20%2F%20Re-registration&body=Hi%20Rebecca,%0A%0AI%20would%20like%20to%20register%20(or%20re-register)%20as%20a%20GTA.%0A%0AName:%20%0AEmail:%20%0ACID%20Number:%20%0APreviously%20registered%3F%20(yes%2Fno):%20%0A%0AThank%20you"
                                           className="text-blue-600 font-bold hover:underline text-lg">
                                            rebecca.lewis1@imperial.ac.uk
                                        </a>

                                            <p className="mb-2">
                                                All GTAs are set up at the <strong>Tier 1</strong> rate. Only an

                                                    </tr>

                                                    <tr><td className="p-1 border">GTA Tier 1</td><td className="text-right p-1 border">£20.84</td><td className="text-right p-1 border">£2.52</td><td className="text-right p-1 border font-medium">£23.36</td></tr>
                                                    <tr><td className="p-1 border">GTA Tier 2</td><td className="text-right p-1 border">£25.35</td><td className="text-right p-1 border">£3.06</td><td className="text-right p-1 border font-medium">£28.41</td></tr>
                                                    <tr><td className="p-1 border">GTA Tier 3</td><td className="text-right p-1 border">£33.71</td><td className="text-right p-1 border">£4.07</td><td className="text-right p-1 border font-medium">£37.78</td></tr>
                                                </tbody>

                                            <p className="mt-2 text-xs">Hourly, in £. You are paid for the hours you actually work.</p>

                                    <p className="text-sm text-gray-600">

                                {/* Pinned, so it is reachable without scrolling

                        if (Array.isArray(s.preferences)) {

                        } else if (typeof s.preferences === 'string' && s.preferences) {
                            prefs = s.preferences.split(',').map(t => t.trim());
                        } else if (s.preferences) {
                            prefs = [String(s.preferences)];
                        }
                        
                        let exp = [];
                        if (Array.isArray(s.expertise)) {
                            exp = s.expertise;
                        } else if (typeof s.expertise === 'string' && s.expertise) {
                            exp = s.expertise.split(',').map(t => t.trim());
                        } else if (s.expertise) {
                            exp = [String(s.expertise)];
                        }
                        
                        return {
                            ...s,
                            id: s.id || `sub-${idx}-${Date.now()}`,
                            preferences: prefs,
                            expertise: exp,
                            maxSessions: parseInt(s.maxSessions) || 3,
                            previousHours: parseInt(s.previousHours) || 0
                        };
                    });
                    
                    // Convert allocations data
                    const convertedAllocations = (allocationsData || []).map(a => ({
                        ...a,
                        preferenceRank: parseInt(a.preferenceRank) || 1,
                        round: parseInt(a.round) || 1,
                        expertiseMatch: parseInt(a.expertiseMatch) || 0
                    }));
                    
                    setPracticals(convertedPracticals);
                    setSubmissions(convertedSubmissions);
                    setAllocations(convertedAllocations);
                    // Vetoes and ratings used to live only in memory, so a veto
                    // vanished on refresh and never reached the allocator.
                    setVetoList((vetoData || []).filter(v => v && v.studentEmail).map((v, i) => ({
                        id: v.id || `veto-${i}`,
                        studentEmail: v.studentEmail || '',
                        convenorEmail: v.convenorEmail || '',
                        reason: v.reason || ''
                    })));
                    setRatings((ratingsData || []).filter(r => r && r.practicalId).map(r => ({
                        ...r,
                        rating: parseInt(r.rating) || 0
                    })));
                    setIsOnline(true);
                    setLastSync(new Date());
                } catch (error) {
                    console.error('Error loading from sheets:', error);
                    setIsOnline(false);
                }
                setIsLoading(false);
            };

            useEffect(() => {
                loadFromSheets();
            }, []);

            // Save practical to Google Sheets
            const addPractical = async (practical) => {
                const newPractical = {
                    ...practical,
                    id: Date.now().toString(),
                    deadline: practical.deadline || practical.date,
                    tags: practical.tags || [],
                    documentUrl: practical.documentUrl || '',
                    convenorEmail: practical.convenorEmail || '',
                    teachingStaff: practical.teachingStaff || '',
                    location: practical.location || '',
                    morningStart: practical.morningStart || '',
                    morningEnd: practical.morningEnd || '',
                    afternoonStart: practical.afternoonStart || '',
                    afternoonEnd: practical.afternoonEnd || ''
                };
                
                // Optimistic update
                const newPracticals = [...practicals, newPractical];
                setPracticals(newPracticals);
                
                if (isConfigured) {
                    setIsSaving(true);
                    const rowData = {
                        id: newPractical.id,
                        name: newPractical.name,
                        courseCode: newPractical.courseCode || '',
                        date: newPractical.date,
                        deadline: newPractical.deadline,
                        slots: newPractical.slots,
                        tags: newPractical.tags.join(', '),
                        documentUrl: newPractical.documentUrl || '',
                        convenorEmail: newPractical.convenorEmail || '',
                        teachingStaff: newPractical.teachingStaff || '',
                        location: newPractical.location || '',
                        morningStart: newPractical.morningStart || '',
                        morningEnd: newPractical.morningEnd || '',
                        afternoonStart: newPractical.afternoonStart || '',
                        afternoonEnd: newPractical.afternoonEnd || ''
                    };
                    await SheetsAPI.append('Practicals', rowData);
                    setIsSaving(false);
                }
            };

            const deletePractical = async (id) => {
                const newPracticals = practicals.filter(p => p.id !== id);
                setPracticals(newPracticals);
                
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.deleteRow('Practicals', id);
                    setIsSaving(false);
                }
            };

            const sessionMinutes = (startTime, endTime) => {
                const a = toHHMM(startTime);
                const b = toHHMM(endTime);
                if (!a || !b) return 0;
                const [sh, sm] = a.split(':').map(Number);
                const [eh, em] = b.split(':').map(Number);
                const minutes = (eh * 60 + em) - (sh * 60 + sm);
                return minutes > 0 ? minutes : 0;
            };

            const formatHours = (totalMinutes) => {
                if (!totalMinutes) return null;
                const hours = totalMinutes / 60;
                return hours % 1 === 0 ? `${hours} hour${hours !== 1 ? 's' : ''}` : `${hours.toFixed(1)} hours`;
            };

            const calculateTotalDuration = (practical) => {
                const totalMinutes = sessionMinutes(practical.morningStart, practical.morningEnd) + sessionMinutes(practical.afternoonStart, practical.afternoonEnd);
                return formatHours(totalMinutes);
            };

            const formatTime = (time24) => {
                const hhmm = toHHMM(time24);
                if (!hhmm) return '';
                const [h, m] = hhmm.split(':').map(Number);
                if (isNaN(h) || isNaN(m)) return '';
                const period = h >= 12 ? 'PM' : 'AM';
                const h12 = h % 12 === 0 ? 12 : h % 12;
                return `${h12}:${String(m).padStart(2, '0')} ${period}`;
            };

            const updatePractical = async (updatedPractical) => {
                const newPracticals = practicals.map(p => 
                    p.id === updatedPractical.id ? updatedPractical : p
                );
                setPracticals(newPracticals);
                
                if (isConfigured) {
                    setIsSaving(true);
                    // Send only the single row that changed (updateRow), rather than
                    // overwriting the whole Practicals sheet from local browser state -
                    // that old approach could silently wipe out other people's practicals
                    // if this tab's copy of the list was stale or incomplete.
                    const rowData = {
                        id: updatedPractical.id,
                        name: updatedPractical.name,
                        courseCode: updatedPractical.courseCode || '',
                        date: updatedPractical.date,
                        deadline: updatedPractical.deadline || updatedPractical.date,
                        slots: updatedPractical.slots,
                        tags: Array.isArray(updatedPractical.tags) ? updatedPractical.tags.join(', ') : updatedPractical.tags,
                        documentUrl: updatedPractical.documentUrl || '',
                        convenorEmail: updatedPractical.convenorEmail || '',
                        teachingStaff: updatedPractical.teachingStaff || '',
                        location: updatedPractical.location || '',
                        morningStart: updatedPractical.morningStart || '',
                        morningEnd: updatedPractical.morningEnd || '',
                        afternoonStart: updatedPractical.afternoonStart || '',
                        afternoonEnd: updatedPractical.afternoonEnd || ''
                    };
                    await SheetsAPI.updateRow('Practicals', rowData);
                    setIsSaving(false);
                }
            };

            const submitPreferences = async () => {
                if (!studentName || !studentEmail) {
                    alert('Please fill in your name and email');
                    return;
                }

                if (preferences.length === 0) {
                    alert('Please select at least one practical preference before submitting.');
                    return;
                }

                if (studentExpertise.length === 0) {
                    alert('Please select at least one area of expertise/interest');
                    return;
                }

                const submission = {
                    id: Date.now().toString(),
                    name: studentName,
                    email: studentEmail,
                    preferences: preferences,
                    expertise: studentExpertise,
                    maxSessions: studentMaxSessions,
                    timestamp: new Date().toISOString(),
                    previousHours: 0,
                    department: studentDepartment,
                    isMature: studentIsMature ? 'Yes' : 'No'
                };

                // Optimistic update
                const newSubmissions = [...submissions, submission];
                setSubmissions(newSubmissions);
                
                if (isConfigured) {
                    setIsSaving(true);
                    const rowData = {
                        id: submission.id,
                        name: submission.name,
                        email: submission.email,
                        preferences: submission.preferences.join(', '),
                        expertise: submission.expertise.join(', '),

                    await SheetsAPI.append('Submissions', rowData);

                setPreferences([]);
                setStudentExpertise([]);
                setStudentMaxSessions(3);
                setStudentDepartment('Life Sciences');
                setStudentIsMature(false);
                alert('Your preferences have been submitted successfully!');
            };

            const runAllocation = async () => {
                const results = [];
                const studentAllocations = {};
                const practicalFills = {};
                const reserveCount = 2; // Number of reserve GTAs per practical
                
                // Blocking a student is done through the Veto panel in the DPS
                // view, which is stored data. It is no longer hard-coded here:
                // this file is served publicly and is readable by anyone.
                const blockedStudents = [];
                
                practicals.forEach(p => { practicalFills[p.id] = 0; });
                submissions.forEach(s => { studentAllocations[s.email] = 0; });

                // Filter out blocked students
                const notBlocked = submissions.filter(s =>
                    !blockedStudents.includes(s.name?.toLowerCase().trim())
                );

                // Keep only each student's most recent submission. Nothing stops a
                // student submitting twice, and duplicates previously counted as
                // two separate people competing for slots.
                const latestByEmail = {};
                notBlocked.forEach(sub => {
                    const key = (sub.email || '').toLowerCase().trim();
                    if (!key) return;
                    const prev = latestByEmail[key];
                    if (!prev || new Date(sub.timestamp || 0) >= new Date(prev.timestamp || 0)) {
                        latestByEmail[key] = sub;
                    }
                });
                const eligibleSubmissions = Object.values(latestByEmail);

                const duplicateCount = notBlocked.length - eligibleSubmissions.length;

                const sortedStudents = [...eligibleSubmissions].sort((a, b) => 
                    (a.previousHours || 0) - (b.previousHours || 0)
                );

                // Main allocation rounds
                for (let round = 1; round <= maxSlotsPerStudent; round++) {
                    for (const student of sortedStudents) {
                        // Respect student's own max sessions preference
                        const studentMax = student.maxSessions || maxSlotsPerStudent;
                        if (studentAllocations[student.email] >= round) continue;
                        if (studentAllocations[student.email] >= studentMax) continue;
                        
                        for (let prefIdx = 0; prefIdx < student.preferences.length; prefIdx++) {
                            const practicalId = student.preferences[prefIdx];
                            const practical = practicals.find(p => p.id === practicalId);
                            
                            if (!practical) continue;
                            if (practicalFills[practicalId] >= practical.slots) continue;
                            
                            const alreadyAllocated = results.some(
                                r => r.studentEmail === student.email && r.practicalId === practicalId
                            );
                            if (alreadyAllocated) continue;

                            // Veto check
                            const isVetoed = vetoList.some(v =>
                                v.studentEmail.toLowerCase() === student.email.toLowerCase() &&
                                v.convenorEmail.toLowerCase() === (practical.convenorEmail || '').toLowerCase()
                            );
                            if (isVetoed) continue;

                            // Non-Life-Sci: only allocate if slots remain after Life Sci students
                            if (student.department && student.department !== 'Life Sciences') {
                                const lifeSciWanted = sortedStudents.filter(s =>
                                    (s.department === 'Life Sciences' || !s.department) &&
                                    s.preferences.includes(practicalId) &&
                                    studentAllocations[s.email] < (s.maxSessions || maxSlotsPerStudent)
                                ).length;
                                if (lifeSciWanted >= (practical.slots - practicalFills[practicalId])) continue;
                            }

                            let expertiseMatch = 0;
                            if (practical.tags && student.expertise) {
                                const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                                const studentExpertise = Array.isArray(student.expertise) ? student.expertise : [];
                                expertiseMatch = practicalTags.filter(t => 
                                    studentExpertise.includes(t)
                                ).length;
                            }

                            results.push({
                                studentName: student.name,
                                studentEmail: student.email,
                                practicalId: practicalId,
                                practicalName: practical.name,
                                practicalDate: practical.date,
                                courseCode: practical.courseCode || '',
                                convenorEmail: practical.convenorEmail || '',
                                preferenceRank: prefIdx + 1,
                                round: round,
                                expertiseMatch: expertiseMatch,
                                isReserve: 'No',
                                status: ''
                            });

                            studentAllocations[student.email]++;
                            practicalFills[practicalId]++;
                            break;
                        }
                    }
                }

                // FILL REMAINING SLOTS: allocate students who had no preferences (or whose
                // preferences were all filled) to practicals that still have open slots,
                // prioritising expertise match, then fewest previous hours.
                for (const practical of practicals) {
                    const slotsLeft = practical.slots - practicalFills[practical.id];
                    if (slotsLeft <= 0) continue;

                    // Students not yet allocated to this practical, not vetoed, eligible dept
                    const candidates = sortedStudents.filter(student => {
                        if (studentAllocations[student.email] >= (student.maxSessions || maxSlotsPerStudent)) return false;
                        if (results.some(r => r.studentEmail === student.email && r.practicalId === practical.id && r.isReserve === 'No')) return false;
                        const isVetoed = vetoList.some(v =>
                            v.studentEmail.toLowerCase() === student.email.toLowerCase() &&
                            v.convenorEmail.toLowerCase() === (practical.convenorEmail || '').toLowerCase()
                        );
                        if (isVetoed) return false;
                        return true;
                    });

                    // Life Sciences first, then expertise match (desc), then
                    // fewest previous hours. Non-Life-Sciences students used to be
                    // dropped entirely here, so unfilled slots stayed unfilled even
                    // when willing students were available.
                    const isLifeSci = (st) => !st.department || st.department === 'Life Sciences';
                    candidates.sort((a, b) => {
                        if (isLifeSci(a) !== isLifeSci(b)) return isLifeSci(a) ? -1 : 1;
                        const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                        const aMatch = Array.isArray(a.expertise) ? practicalTags.filter(t => a.expertise.includes(t)).length : 0;
                        const bMatch = Array.isArray(b.expertise) ? practicalTags.filter(t => b.expertise.includes(t)).length : 0;
                        if (bMatch !== aMatch) return bMatch - aMatch;
                        return (a.previousHours || 0) - (b.previousHours || 0);
                    });

                    for (const student of candidates) {
                        if (practicalFills[practical.id] >= practical.slots) break;
                        const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                        const expertiseMatch = Array.isArray(student.expertise) ? practicalTags.filter(t => student.expertise.includes(t)).length : 0;
                        results.push({
                            studentName: student.name,
                            studentEmail: student.email,
                            practicalId: practical.id,
                            practicalName: practical.name,
                            practicalDate: practical.date,
                            courseCode: practical.courseCode || '',
                            convenorEmail: practical.convenorEmail || '',
                            preferenceRank: 99, // indicates auto-assigned
                            round: 99,
                            expertiseMatch: expertiseMatch,
                            isReserve: 'No',
                            status: ''
                        });
                        studentAllocations[student.email]++;
                        practicalFills[practical.id]++;
                    }
                }

                // Reserve allocation - find students who wanted each practical but didn't get it
                for (const practical of practicals) {
                    let reserveFilled = 0;
                    
                    // Get students who selected this practical but weren't allocated to it
                    const interestedStudents = sortedStudents.filter(student => {
                        const wantedThis = student.preferences.includes(practical.id);
                        const alreadyGotThis = results.some(
                            r => r.studentEmail === student.email && r.practicalId === practical.id && r.isReserve === 'No'
                        );
                        return wantedThis && !alreadyGotThis;
                    });

                    // Sort by preference rank for this practical (those who ranked it higher get reserve priority)
                    interestedStudents.sort((a, b) => {
                        const aRank = a.preferences.indexOf(practical.id);
                        const bRank = b.preferences.indexOf(practical.id);
                        return aRank - bRank;
                    });

                    // Allocate reserves
                    for (const student of interestedStudents) {
                        if (reserveFilled >= reserveCount) break;

                        const prefIdx = student.preferences.indexOf(practical.id);
                        let expertiseMatch = 0;
                        if (practical.tags && student.expertise) {
                            const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                            const studentExpertise = Array.isArray(student.expertise) ? student.expertise : [];
                            expertiseMatch = practicalTags.filter(t => 
                                studentExpertise.includes(t)
                            ).length;
                        }

                        results.push({
                            studentName: student.name,
                            studentEmail: student.email,
                            practicalId: practical.id,
                            practicalName: practical.name,
                            practicalDate: practical.date,
                            courseCode: practical.courseCode || '',
                            convenorEmail: practical.convenorEmail || '',
                            preferenceRank: prefIdx + 1,
                            round: 0,
                            expertiseMatch: expertiseMatch,
                            isReserve: 'Yes',
                            status: ''
                        });

                        reserveFilled++;
                    }
                }

                // PREVIEW ONLY. Nothing is written to the sheet and no convenor is
                // emailed until "Save & Notify Convenors" is clicked. This used to
                // do both immediately, leaving no chance to check the result first.
                setPreviewAllocations(results);
                setPreviewMeta({ duplicateCount: duplicateCount, generatedAt: new Date() });

                const mainAllocations = results.filter(r => r.isReserve === 'No');
                const reserveAllocations = results.filter(r => r.isReserve === 'Yes');
                const dupNote = duplicateCount > 0
                    ? `\n\n${duplicateCount} duplicate submission(s) ignored - only each student's most recent entry was used.`
                    : '';
                alert(
                    `Preview ready: ${mainAllocations.length} main slots and ${reserveAllocations.length} reserve slots.` +
                    dupNote +
                    `\n\nNothing has been saved and no emails have been sent. Review the preview, ` +
                    `then click "Save & Notify Convenors" to commit it.`
                );
            };

            const discardPreview = () => {
                setPreviewAllocations(null);
                setPreviewMeta(null);
            };

            // The only path that changes stored data or sends email.
            const commitAllocation = async () => {
                if (!previewAllocations) return;

                // Saving replaces the whole Allocations sheet, so warn if students
                // have already responded to a previous round.
                const responded = allocations.filter(a => a.status === 'Confirmed' || a.status === 'Declined');
                if (responded.length > 0) {
                    const ok = confirm(
                        `WARNING: ${responded.length} student response(s) (confirmed or declined) are already ` +
                        `recorded against the current allocation.\n\n` +
                        `Saving this new allocation REPLACES the Allocations sheet and those responses ` +
                        `will be lost. Convenors will also be emailed again.\n\nContinue?`
                    );
                    if (!ok) return;
                }

                const mainCount = previewAllocations.filter(r => r.isReserve === 'No').length;
                if (!confirm(
                    `Save this allocation (${mainCount} main slots)?\n\n` +
                    `This will email the convenors, and send the registration contacts the ` +
                    `list of allocated students to check.\n\n` +
                    `Students are NOT emailed by this step - use "Send Allocation Emails" separately.`
                )) return;

                setAllocations(previewAllocations);

                let regResult = null;
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', previewAllocations);
                    await SheetsAPI.request('sendConvenorEmails', 'Allocations', null);
                    // Send the casual-worker registration contacts the list of
                    // allocated students, so registration can be checked before
                    // anyone's first session.
                    regResult = await SheetsAPI.request('notifyRegistrationTeam', 'Allocations', null);
                    setIsSaving(false);
                }

                setPreviewAllocations(null);
                setPreviewMeta(null);

                const regNote = regResult && regResult.success
                    ? `\nRegistration check list sent to ${regResult.recipients} contact(s).`
                    : regResult
                        ? `\nNOTE: the registration check email did NOT go out (${regResult.error || 'unknown error'}). Check REGISTRATION_NOTIFY in Code.gs.`
                        : '';

                alert('Allocation saved and convenors notified.' + regNote +
                      '\n\nStudents have not been emailed yet - use "Send Allocation Emails" when you are ready.');
            };

            const exportAllocations = () => {
                // Quote every field: names and practical titles routinely contain
                // commas, which silently corrupted the exported CSV before.
                const esc = (v) => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
                const csv = [
                    ['Student Name', 'Email', 'Practical', 'Course Code', 'Date', 'Preference Rank', 'Round', 'Expertise Match', 'Reserve', 'Status', 'Convenor Email'].map(esc).join(','),
                    ...allocations.map(a => [
                        a.studentName,
                        a.studentEmail,
                        a.practicalName,
                        a.courseCode || '',
                        a.practicalDate,
                        a.preferenceRank,
                        a.round,
                        a.expertiseMatch || 0,
                        a.isReserve || 'No',
                        a.status || 'Pending',
                        a.convenorEmail || ''
                    ].map(esc).join(','))
                ].join('\r\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'gta-allocations.csv';
                a.click();
            };

            const clearAllocations = async () => {
                if (!confirm('Are you sure you want to clear ALL allocations? This cannot be undone.')) return;
                
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('Allocations cleared successfully.');
            };

            const clearSubmissions = async () => {
                if (!confirm('Are you sure you want to clear ALL student submissions? This cannot be undone.')) return;
                
                setSubmissions([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Submissions', []);
                    setIsSaving(false);
                }
                alert('Submissions cleared successfully.');
            };

            const clearPracticals = async () => {
                if (!confirm('Are you sure you want to clear ALL practicals? This will also clear submissions and allocations. This cannot be undone.')) return;
                
                setPracticals([]);
                setSubmissions([]);
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Practicals', []);
                    await SheetsAPI.update('Submissions', []);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('All practicals, submissions, and allocations cleared successfully.');
            };

            const clearAllData = async () => {
                if (!confirm('⚠️ WARNING: This will delete ALL data (practicals, submissions, and allocations). Are you absolutely sure?')) return;
                if (!confirm('This is your last chance to cancel. Click OK to permanently delete all data.')) return;
                
                setPracticals([]);
                setSubmissions([]);
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Practicals', []);
                    await SheetsAPI.update('Submissions', []);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('All data has been cleared.');
            };

            // Confirm/Decline allocation functions
            const confirmAllocation = async (allocation) => {
                const updatedAllocations = allocations.map(a => {
                    if (a.studentEmail === allocation.studentEmail && String(a.practicalId) === String(allocation.practicalId)) {
                        return { ...a, status: 'Confirmed' };
                    }
                    return a;
                });
                
                setAllocations(updatedAllocations);
                
                if (isConfigured) {
                    setIsSaving(true);
                    // Update only this student's own row - not the whole sheet, so a
                    // stale tab can't undo other students' confirms/declines made since
                    // this page loaded.
                    await SheetsAPI.updateRows('Allocations', [{
                        match: {
                            studentEmail: allocation.studentEmail,
                            practicalId: String(allocation.practicalId),
                            isReserve: 'No'
                        },
                        values: { status: 'Confirmed' }
                    }]);
                    setIsSaving(false);
                }
                
                alert('Thank you for confirming your allocation!');
            };

            const declineAllocation = async (allocation) => {
                if (!confirm(`Are you sure you want to decline "${allocation.practicalName}"? A reserve GTA will be contacted to take your place.`)) {
                    return;
                }
                
                // Find a reserve for this practical to promote
                const reserve = allocations.find(a => 
                    String(a.practicalId) === String(allocation.practicalId) && 
                    a.isReserve === 'Yes' && 
                    (!a.status || a.status === 'Pending')
                );
                
                // Update allocations
                const updatedAllocations = allocations.map(a => {
                    // Mark declined allocation
                    if (a.studentEmail === allocation.studentEmail && String(a.practicalId) === String(allocation.practicalId) && a.isReserve !== 'Yes') {
                        return { ...a, status: 'Declined' };
                    }
                    // Promote reserve if found
                    if (reserve && a.studentEmail === reserve.studentEmail && String(a.practicalId) === String(reserve.practicalId) && a.isReserve === 'Yes') {
                        return { ...a, isReserve: 'Promoted', status: 'Pending' };
                    }
                    return a;
                });
                
                setAllocations(updatedAllocations);
                
                if (isConfigured) {
                    setIsSaving(true);
                    // Update only the two rows actually affected (the declining
                    // student's row, and the promoted reserve's row if any) - not
                    // the whole sheet, so a stale tab can't undo other students'
                    // confirms/declines/promotions made since this page loaded.
                    const rowUpdates = [{
                        match: {
                            studentEmail: allocation.studentEmail,
                            practicalId: String(allocation.practicalId),
                            isReserve: 'No'
                        },
                        values: { status: 'Declined' }
                    }];
                    if (reserve) {
                        rowUpdates.push({
                            match: {
                                studentEmail: reserve.studentEmail,
                                practicalId: String(reserve.practicalId),
                                isReserve: 'Yes'
                            },
                            values: { isReserve: 'Promoted', status: 'Pending' }
                        });
                    }
                    await SheetsAPI.updateRows('Allocations', rowUpdates);
                    
                    // Notify reserve if one was promoted
                    if (reserve) {
                        await SheetsAPI.request('notifyPromotedReserve', 'Allocations', {
                            studentEmail: reserve.studentEmail,
                            studentName: reserve.studentName,
                            practicalName: allocation.practicalName,
                            practicalDate: allocation.practicalDate,
                            courseCode: allocation.courseCode,
                            convenorEmail: allocation.convenorEmail
                        });
                    }
                    
                    // Notify convenor of the decline
                    await SheetsAPI.request('notifyConvenorDecline', 'Allocations', {
                        convenorEmail: allocation.convenorEmail,
                        studentName: allocation.studentName,
                        practicalName: allocation.practicalName,
                        reserveName: reserve?.studentName || null
                    });
                    
                    setIsSaving(false);
                }
                
                if (reserve) {
                    alert(`You have declined this allocation. ${reserve.studentName} (reserve) has been notified to take your place.`);
                } else {
                    alert('You have declined this allocation. The convenor has been notified.');
                }
            };

            // Check URL for confirm/decline actions on page load
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const action = params.get('action');
                const email = params.get('email');
                const practicalId = params.get('practical');
                
                if (action && email && practicalId && allocations.length > 0) {
                    const allocation = allocations.find(a => 
                        a.studentEmail?.toLowerCase() === email.toLowerCase() && 
                        String(a.practicalId) === String(practicalId) &&
                        a.isReserve !== 'Yes'
                    );
                    
                    if (allocation) {
                        setStudentEmail(email);
                        setView('student');
                        
                        // Clear URL params
                        window.history.replaceState({}, '', window.location.pathname);
                        
                        if (action === 'confirm') {
                            setTimeout(() => confirmAllocation(allocation), 500);
                        } else if (action === 'decline') {
                            setTimeout(() => declineAllocation(allocation), 500);
                        }
                    }
                }
            }, [allocations]);







            // Shared state + handlers handed to the top-level views.
            // A fresh object each render is fine: it re-renders the views,
            // it does not remount them, so their own state survives.
            const ctx = {
                view, setView, isAdminAuthenticated, setIsAdminAuthenticated,
                isDPSAuthenticated, setIsDPSAuthenticated, studentName, setStudentName,
                studentEmail, setStudentEmail, studentExpertise, setStudentExpertise,
                studentMaxSessions, setStudentMaxSessions, studentDepartment,
                setStudentDepartment, studentIsMature, setStudentIsMature, vetoList,
                setVetoList, ratings, setRatings, practicals, setPracticals, preferences,
                setPreferences, submissions, setSubmissions, allocations, setAllocations,
                maxSlotsPerStudent, setMaxSlotsPerStudent, expertiseTags, setExpertiseTags,
                isLoading, setIsLoading, isOnline, lastSync, isSaving, setIsSaving,
                isConfigured, loadFromSheets, addPractical, deletePractical, updatePractical,
                submitPreferences, runAllocation, exportAllocations, clearAllocations,
                previewAllocations, previewMeta, commitAllocation, discardPreview,
                clearSubmissions, clearPracticals, clearAllData, confirmAllocation,
                declineAllocation, getAdminPassword, getDPSPassword, sessionMinutes,
                formatHours, calculateTotalDuration, formatTime
            };

            if (isLoading && isConfigured) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <RefreshCw className="animate-spin mx-auto mb-4 text-purple-600" size={40} />
                            <p className="text-gray-600">Loading data from Google Sheets...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    <ConnectionStatus ctx={ctx} />
                    <div className="bg-white shadow-sm border-b">
                        <div className="max-w-6xl mx-auto px-6 py-4">
                            <div className="flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-gray-800">Imperial DoLS GTA Allocator</h1>
                                <div className="flex space-x-2">
                                    <button
                                        onClick={() => setView('student')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'student' 
                                                ? 'bg-blue-600 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Users size={20} className="mr-2" />
                                        Student View
                                    </button>
                                    <button
                                        onClick={() => setView('convenor')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'convenor' 
                                                ? 'bg-purple-600 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Settings size={20} className="mr-2" />
                                        Convenor View
                                    </button>
                                    <button
                                        onClick={() => setView('dps')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'dps' 
                                                ? 'bg-purple-800 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Settings size={20} className="mr-2" />
                                        DPS View
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {view === 'student' ? <StudentView ctx={ctx} /> : view === 'convenor' ? <ConvenorView ctx={ctx} /> : <DPSView ctx={ctx} />}
                </div>
            );
        };

        ReactDOM.render(<GTAAllocator />, document.getElementById('root'));
    </script>
</body>
</html>
