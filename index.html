                // this file is served publicly and is readable by anyone.
                const blockedStudents = [];
                
                practicals.forEach(p => { practicalFills[p.id] = 0; });
                submissions.forEach(s => { studentAllocations[s.email] = 0; });

                // TIMETABLE CLASH CHECK. A GTA on a practical covers all of its
                // sessions that day, so two practicals clash when they fall on the
                // same date and any of their session times overlap. A practical
                // with no times entered is treated as all day (conservative).
                const dayKey = (d) => {
                    if (!d) return '';
                    const str = String(d).trim();
                    let m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
                    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
                    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(str);
                    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
                    const dt = new Date(str);
                    if (isNaN(dt.getTime())) return '';
                    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
                };
                const toMins = (t) => { const v = toHHMM(t); if (!v) return null; const [h, mm] = v.split(':').map(Number); return h * 60 + mm; };
                const sessionsOf = (p) => {
                    const out = [];
                    [[p.morningStart, p.morningEnd], [p.afternoonStart, p.afternoonEnd]].forEach(([a, b]) => {
                        const s1 = toMins(a), e1 = toMins(b);
                        if (s1 !== null && e1 !== null && e1 > s1) out.push([s1, e1]);
                    });
                    return out.length ? out : [[0, 24 * 60]];
                };
                const practicalsClash = (p1, p2) => {
                    if (String(p1.id) === String(p2.id)) return false;
                    const k1 = dayKey(p1.date), k2 = dayKey(p2.date);
                    if (!k1 || k1 !== k2) return false;
                    return sessionsOf(p1).some(([a1, b1]) => sessionsOf(p2).some(([a2, b2]) => a1 < b2 && a2 < b1));
                };
                const mainBookings = {}; // email -> practicals already given as main slots
                const clashesFor = (email, practical) =>
                    (mainBookings[email] || []).filter(other => practicalsClash(practical, other));
                const book = (email, practical) => { (mainBookings[email] = mainBookings[email] || []).push(practical); };
                let clashesAvoided = 0;
                const blockedByClash = {}; // practicalId -> number of willing students skipped due to a clash

                // Filter out blocked students
                const notBlocked = submissions.filter(s =>
                    !blockedStudents.includes(s.name?.toLowerCase().trim())
                );

                // Keep only each student's most recent submission. Nothing stops a
                // student submitting twice, and duplicates previously counted as
                // two separate people competing for slots.
                const latestByEmail = {};
                notBlocked.forEach(sub => {
                    const key = (sub.email || '').toLowerCase().trim();
                    if (!key) return;
                    const prev = latestByEmail[key];
                    if (!prev || new Date(sub.timestamp || 0) >= new Date(prev.timestamp || 0)) {
                        latestByEmail[key] = sub;
                    }
                });
                const eligibleSubmissions = Object.values(latestByEmail);

                const duplicateCount = notBlocked.length - eligibleSubmissions.length;

                const sortedStudents = [...eligibleSubmissions].sort((a, b) => 
                    (a.previousHours || 0) - (b.previousHours || 0)
                );

                // Main allocation rounds
                for (let round = 1; round <= maxSlotsPerStudent; round++) {
                    for (const student of sortedStudents) {
                        // Respect student's own max sessions preference
                        const studentMax = student.maxSessions || maxSlotsPerStudent;
                        if (studentAllocations[student.email] >= round) continue;
                        if (studentAllocations[student.email] >= studentMax) continue;
                        
                        for (let prefIdx = 0; prefIdx < student.preferences.length; prefIdx++) {
                            const practicalId = student.preferences[prefIdx];
                            const practical = practicals.find(p => p.id === practicalId);
                            
                            if (!practical) continue;
                            if (practicalFills[practicalId] >= practical.slots) continue;
                            
                            const alreadyAllocated = results.some(
                                r => r.studentEmail === student.email && r.practicalId === practicalId
                            );
                            if (alreadyAllocated) continue;

                            // Veto check
                            const isVetoed = vetoList.some(v =>
                                v.studentEmail.toLowerCase() === student.email.toLowerCase() &&
                                v.convenorEmail.toLowerCase() === (practical.convenorEmail || '').toLowerCase()
                            );
                            if (isVetoed) continue;

                            if (clashesFor(student.email, practical).length) {
                                clashesAvoided++;
                                blockedByClash[practical.id] = (blockedByClash[practical.id] || 0) + 1;
                                continue;
                            }

                            // Non-Life-Sci: only allocate if slots remain after Life Sci students
                            if (student.department && student.department !== 'Life Sciences') {
                                const lifeSciWanted = sortedStudents.filter(s =>
                                    (s.department === 'Life Sciences' || !s.department) &&
                                    s.preferences.includes(practicalId) &&
                                    studentAllocations[s.email] < (s.maxSessions || maxSlotsPerStudent)
                                ).length;
                                if (lifeSciWanted >= (practical.slots - practicalFills[practicalId])) continue;
                            }

                            let expertiseMatch = 0;
                            if (practical.tags && student.expertise) {
                                const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                                const studentExpertise = Array.isArray(student.expertise) ? student.expertise : [];
                                expertiseMatch = practicalTags.filter(t => 
                                    studentExpertise.includes(t)
                                ).length;
                            }

                            results.push({
                                studentName: student.name,
                                studentEmail: student.email,
                                practicalId: practicalId,
                                practicalName: practical.name,
                                practicalDate: practical.date,
                                courseCode: practical.courseCode || '',
                                convenorEmail: practical.convenorEmail || '',
                                preferenceRank: prefIdx + 1,
                                round: round,
                                expertiseMatch: expertiseMatch,
                                isReserve: 'No',
                                status: ''
                            });

                            book(student.email, practical);
                            studentAllocations[student.email]++;
                            practicalFills[practicalId]++;
                            break;
                        }
                    }
                }

                // FILL REMAINING SLOTS: allocate students who OPTED IN to being placed on
                // practicals they didn't choose (openToOtherSessions = Yes) to practicals
                // that still have open slots. Anything left shows as unfilled in the preview,
                // prioritising expertise match, then fewest previous hours.
                for (const practical of practicals) {
                    const slotsLeft = practical.slots - practicalFills[practical.id];
                    if (slotsLeft <= 0) continue;

                    // Students not yet allocated to this practical, not vetoed, eligible dept
                    const candidates = sortedStudents.filter(student => {
                        // Only students who opted in are placed on practicals they didn't choose.
                        if (String(student.openToOtherSessions || '').toLowerCase() !== 'yes') return false;
                        if (studentAllocations[student.email] >= (student.maxSessions || maxSlotsPerStudent)) return false;
                        if (results.some(r => r.studentEmail === student.email && r.practicalId === practical.id && r.isReserve === 'No')) return false;
                        const isVetoed = vetoList.some(v =>
                            v.studentEmail.toLowerCase() === student.email.toLowerCase() &&
                            v.convenorEmail.toLowerCase() === (practical.convenorEmail || '').toLowerCase()
                        );
                        if (isVetoed) return false;
                        if (clashesFor(student.email, practical).length) {
                            clashesAvoided++;
                            blockedByClash[practical.id] = (blockedByClash[practical.id] || 0) + 1;
                            return false;
                        }
                        return true;
                    });

                    // Life Sciences first, then expertise match (desc), then
                    // fewest previous hours. Non-Life-Sciences students used to be
                    // dropped entirely here, so unfilled slots stayed unfilled even
                    // when willing students were available.
                    const isLifeSci = (st) => !st.department || st.department === 'Life Sciences';
                    candidates.sort((a, b) => {
                        if (isLifeSci(a) !== isLifeSci(b)) return isLifeSci(a) ? -1 : 1;
                        const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                        const aMatch = Array.isArray(a.expertise) ? practicalTags.filter(t => a.expertise.includes(t)).length : 0;
                        const bMatch = Array.isArray(b.expertise) ? practicalTags.filter(t => b.expertise.includes(t)).length : 0;
                        if (bMatch !== aMatch) return bMatch - aMatch;
                        return (a.previousHours || 0) - (b.previousHours || 0);
                    });

                    for (const student of candidates) {
                        if (practicalFills[practical.id] >= practical.slots) break;
                        // Re-check: an earlier student in this loop can't clash, but
                        // keep the guard in case the candidate list goes stale.
                        if (clashesFor(student.email, practical).length) continue;
                        const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                        const expertiseMatch = Array.isArray(student.expertise) ? practicalTags.filter(t => student.expertise.includes(t)).length : 0;
                        results.push({
                            studentName: student.name,
                            studentEmail: student.email,
                            practicalId: practical.id,
                            practicalName: practical.name,
                            practicalDate: practical.date,
                            courseCode: practical.courseCode || '',
                            convenorEmail: practical.convenorEmail || '',
                            preferenceRank: 99, // indicates auto-assigned
                            round: 99,
                            expertiseMatch: expertiseMatch,
                            isReserve: 'No',
                            status: ''
                        });
                        book(student.email, practical);
                        studentAllocations[student.email]++;
                        practicalFills[practical.id]++;
                    }
                }

                // Reserve allocation - find students who wanted each practical but didn't get it
                for (const practical of practicals) {
                    let reserveFilled = 0;
                    
                    // Get students who selected this practical but weren't allocated to it
                    const interestedStudents = sortedStudents.filter(student => {
                        const wantedThis = student.preferences.includes(practical.id);
                        const alreadyGotThis = results.some(
                            r => r.studentEmail === student.email && r.practicalId === practical.id && r.isReserve === 'No'
                        );
                        return wantedThis && !alreadyGotThis && clashesFor(student.email, practical).length === 0;
                    });

                    // Sort by preference rank for this practical (those who ranked it higher get reserve priority)
                    interestedStudents.sort((a, b) => {
                        const aRank = a.preferences.indexOf(practical.id);
                        const bRank = b.preferences.indexOf(practical.id);
                        return aRank - bRank;
                    });

                    // Allocate reserves
                    for (const student of interestedStudents) {
                        if (reserveFilled >= reserveCount) break;

                        const prefIdx = student.preferences.indexOf(practical.id);
                        let expertiseMatch = 0;
                        if (practical.tags && student.expertise) {
                            const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                            const studentExpertise = Array.isArray(student.expertise) ? student.expertise : [];
                            expertiseMatch = practicalTags.filter(t => 
                                studentExpertise.includes(t)
                            ).length;
                        }

                        results.push({
                            studentName: student.name,
                            studentEmail: student.email,
                            practicalId: practical.id,
                            practicalName: practical.name,
                            practicalDate: practical.date,
                            courseCode: practical.courseCode || '',
                            convenorEmail: practical.convenorEmail || '',
                            preferenceRank: prefIdx + 1,
                            round: 0,
                            expertiseMatch: expertiseMatch,
                            isReserve: 'Yes',
                            status: ''
                        });

                        reserveFilled++;
                    }
                }

                // PREVIEW ONLY. Nothing is written to the sheet and no convenor is
                // emailed until "Save & Notify Convenors" is clicked. This used to
                // do both immediately, leaving no chance to check the result first.
                // Independent audit: list any student still double-booked (should be none).
                const practicalById = {};
                practicals.forEach(p => { practicalById[String(p.id)] = p; });
                const remainingClashes = [];
                const byStudent = {};
                results.filter(r => r.isReserve === 'No').forEach(r => {
                    (byStudent[r.studentEmail] = byStudent[r.studentEmail] || []).push(r);
                });
                Object.values(byStudent).forEach(list => {
                    for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
                        const p1 = practicalById[String(list[i].practicalId)], p2 = practicalById[String(list[j].practicalId)];
                        if (p1 && p2 && practicalsClash(p1, p2)) remainingClashes.push({ student: list[i].studentName, a: p1.name, b: p2.name, date: p1.date });
                    }
                });

                setPreviewAllocations(results);
                setPreviewMeta({ duplicateCount, generatedAt: new Date(), clashesAvoided, blockedByClash, remainingClashes });

                const mainAllocations = results.filter(r => r.isReserve === 'No');
                const reserveAllocations = results.filter(r => r.isReserve === 'Yes');
                const totalSlotsAll = practicals.reduce((n, p) => n + (parseInt(p.slots) || 0), 0);
                const unfilledAll = totalSlotsAll - mainAllocations.length;
                const dupNote = duplicateCount > 0
                    ? `\n\n${duplicateCount} duplicate submission(s) ignored - only each student's most recent entry was used.`
                    : '';
                alert(
                    `Preview ready: ${mainAllocations.length} main slots and ${reserveAllocations.length} reserve slots.` +
                    (unfilledAll > 0 ? `\n\n⚠️ ${unfilledAll} of ${totalSlotsAll} slots have no GTA - see the list in the preview.` : `\n\nAll ${totalSlotsAll} slots are filled.`) +
                    `\n\nTimetable clashes avoided: ${clashesAvoided}.` +
                    (remainingClashes.length ? `\n⚠️ ${remainingClashes.length} clash(es) remain - see preview.` : '') +
                    dupNote +
                    `\n\nNothing has been saved and no emails have been sent. Review the preview, ` +
                    `then click "Save & Notify Convenors" to commit it.`
                );
            };

            const discardPreview = () => {
                setPreviewAllocations(null);
                setPreviewMeta(null);
            };

            // The only path that changes stored data or sends email.
            const commitAllocation = async () => {
                if (!previewAllocations) return;

                // Saving replaces the whole Allocations sheet, so warn if students
                // have already responded to a previous round.
                const responded = allocations.filter(a => a.status === 'Confirmed' || a.status === 'Declined' || a.status === 'Removed');
                if (responded.length > 0) {
                    const ok = confirm(
                        `WARNING: ${responded.length} student response(s) (confirmed or declined) are already ` +
                        `recorded against the current allocation.\n\n` +
                        `Saving this new allocation REPLACES the Allocations sheet and those responses ` +
                        `will be lost. Convenors will also be emailed again.\n\nContinue?`
                    );
                    if (!ok) return;
                }

                const mainCount = previewAllocations.filter(r => r.isReserve === 'No').length;
                if (!confirm(
                    `Save this allocation (${mainCount} main slots)?\n\n` +
                    `This will email the convenors, and send the registration contacts the ` +
                    `list of allocated students to check.\n\n` +
                    `Students are NOT emailed by this step - use "Send Allocation Emails" separately.`
                )) return;

                setAllocations(previewAllocations);

                let regResult = null;
                let convResult = null;
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', previewAllocations);
                    convResult = await SheetsAPI.request('sendConvenorEmails', 'Allocations', null);
                    // Send the casual-worker registration contacts the list of
                    // allocated students, so registration can be checked before
                    // anyone's first session.
                    regResult = await SheetsAPI.request('notifyRegistrationTeam', 'Allocations', null);
                    setIsSaving(false);
                }

                setPreviewAllocations(null);
                setPreviewMeta(null);

                const regNote = regResult && regResult.success
                    ? `\nRegistration check list sent to ${regResult.recipients} contact(s).`
                    : regResult
                        ? `\nNOTE: the registration check email did NOT go out (${regResult.error || 'unknown error'}). Check REGISTRATION_NOTIFY in Code.gs.`
                        : '';

                const convOk = convResult && convResult.success !== false && convResult.emailsSent > 0;
                const convNote = !isConfigured ? '' : convOk
                    ? `\n${convResult.emailsSent} convenor email(s) sent.`
                    : `\nWARNING: convenor emails did NOT go out (${(convResult && convResult.error) || 'no response'}). Use "Resend convenor emails" in the DPS view.`;
                alert((convOk || !isConfigured ? 'Allocation saved and convenors notified.' : 'Allocation saved.') + convNote + regNote +
                      '\n\nStudents have not been emailed yet - use "Send Allocation Emails" when you are ready.');
            };

            const exportAllocations = () => {
                // Quote every field: names and practical titles routinely contain
                // commas, which silently corrupted the exported CSV before.
                const esc = (v) => '"' + String(v === undefined || v === null ? '' : v).replace(/"/g, '""') + '"';
                const csv = [
                    ['Student Name', 'Email', 'Practical', 'Course Code', 'Date', 'Preference Rank', 'Round', 'Expertise Match', 'Reserve', 'Status', 'Convenor Email'].map(esc).join(','),
                    ...allocations.map(a => [
                        a.studentName,
                        a.studentEmail,
                        a.practicalName,
                        a.courseCode || '',
                        a.practicalDate,
                        a.preferenceRank,
                        a.round,
                        a.expertiseMatch || 0,
                        a.isReserve || 'No',
                        a.status || 'Pending',
                        a.convenorEmail || ''
                    ].map(esc).join(','))
                ].join('\r\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'gta-allocations.csv';
                a.click();
            };

            const clearAllocations = async () => {
                if (!confirm('Are you sure you want to clear ALL allocations? This cannot be undone.')) return;
                
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('Allocations cleared successfully.');
            };

            const clearSubmissions = async () => {
                if (!confirm('Are you sure you want to clear ALL student submissions? This cannot be undone.')) return;
                
                setSubmissions([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Submissions', []);
                    setIsSaving(false);
                }
                alert('Submissions cleared successfully.');
            };

            const clearPracticals = async () => {
                if (!confirm('Are you sure you want to clear ALL practicals? This will also clear submissions and allocations. This cannot be undone.')) return;
                
                setPracticals([]);
                setSubmissions([]);
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Practicals', []);
                    await SheetsAPI.update('Submissions', []);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('All practicals, submissions, and allocations cleared successfully.');
            };

            const clearAllData = async () => {
                if (!confirm('⚠️ WARNING: This will delete ALL data (practicals, submissions, and allocations). Are you absolutely sure?')) return;
                if (!confirm('This is your last chance to cancel. Click OK to permanently delete all data.')) return;
                
                setPracticals([]);
                setSubmissions([]);
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Practicals', []);
                    await SheetsAPI.update('Submissions', []);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('All data has been cleared.');
            };

            // DPS: fill an empty slot with a reserve (promote) or any eligible student.
            const fillSlot = async (practical, pick) => {
                let updated = allocations;
                let newRow = null;
                if (pick.reserveRow) {
                    updated = allocations.map(a =>
                        (a.studentEmail === pick.reserveRow.studentEmail && String(a.practicalId) === String(practical.id) && a.isReserve === 'Yes')
                            ? { ...a, isReserve: 'Promoted', status: 'Pending' } : a);
                } else {
                    const sub = submissions.find(s => (s.email || '').toLowerCase() === pick.email.toLowerCase());
                    const rank = sub && Array.isArray(sub.preferences) ? sub.preferences.map(String).indexOf(String(practical.id)) : -1;
                    newRow = {
                        studentName: pick.name, studentEmail: pick.email, practicalId: String(practical.id),
                        practicalName: practical.name, practicalDate: practical.date, courseCode: practical.courseCode || '',
                        convenorEmail: practical.convenorEmail || '', preferenceRank: rank >= 0 ? rank + 1 : 99,
                        round: 0, expertiseMatch: 0, isReserve: 'Promoted', status: 'Pending'
                    };
                    updated = [...allocations, newRow];
                }
                if (isConfigured) {
                    setIsSaving(true);
                    try {
                        if (pick.reserveRow) {
                            const r = await SheetsAPI.updateRows('Allocations', [{
                                match: { studentEmail: pick.reserveRow.studentEmail, practicalId: String(practical.id), isReserve: 'Yes' },
                                values: { isReserve: 'Promoted', status: 'Pending' }
                            }]);
                            if (!r || r.success === false || r.updated === 0) throw new Error((r && r.error) || 'reserve row not found');
                        } else {
                            const r = await SheetsAPI.append('Allocations', newRow);
                            if (!r || r.success === false) throw new Error((r && r.error) || 'append failed');
                        }
                    } catch (e) {
                        setIsSaving(false);
                        console.error('fillSlot failed:', e);
                        alert('Could not save that change to Google Sheets. Nothing has been emailed. Reload and try again.');
                        await loadFromSheets();
                        return null;
                    }
                    await SheetsAPI.request('notifyPromotedReserve', 'Allocations', {
                        practicalId: String(practical.id), studentEmail: pick.email, studentName: pick.name,
                        practicalName: practical.name, practicalDate: practical.date,
                        courseCode: practical.courseCode, convenorEmail: practical.convenorEmail
                    });
                    const n = await SheetsAPI.request('notifySlotFilled', 'Allocations', {
                        practicalId: String(practical.id), studentEmail: pick.email
                    });
                    setIsSaving(false);
                    setAllocations(updated);
                    return n && n.success
                        ? `✓ ${pick.name} added and emailed; convenor notified.`
                        : `✓ ${pick.name} added and emailed. The convenor email didn't go through - please let them know.`;
                }
                setAllocations(updated);
                return `✓ ${pick.name} added.`;
            };

            // DPS remove / replace. Updates only the affected rows, emails an
            // incoming GTA via the existing promotion email, and returns
            // pre-written drafts for the convenor and the removed student.
            const reassignAllocation = async (alloc, replacement, reason) => {
                const fmt = (d) => { const k = gtaDayKey(d); return k ? k.split('-').reverse().join('/') : (d || ''); };
                const why = reason ? `\n\nReason: ${reason}` : '';
                let updated = allocations.map(a =>
                    (a.studentEmail === alloc.studentEmail && String(a.practicalId) === String(alloc.practicalId) && a.isReserve === alloc.isReserve)
                        ? { ...a, status: 'Removed' } : a);
                let newRow = null;
                if (replacement && replacement.reserveRow) {
                    const r = replacement.reserveRow;
                    updated = updated.map(a =>
                        (a.studentEmail === r.studentEmail && String(a.practicalId) === String(r.practicalId) && a.isReserve === 'Yes')
                            ? { ...a, isReserve: 'Promoted', status: 'Pending' } : a);
                } else if (replacement) {
                    const sub = submissions.find(s => (s.email || '').toLowerCase() === replacement.email.toLowerCase());
                    const rank = sub && Array.isArray(sub.preferences) ? sub.preferences.map(String).indexOf(String(alloc.practicalId)) : -1;
                    newRow = {
                        studentName: replacement.name, studentEmail: replacement.email,
                        practicalId: String(alloc.practicalId), practicalName: alloc.practicalName,
                        practicalDate: alloc.practicalDate, courseCode: alloc.courseCode || '',
                        convenorEmail: alloc.convenorEmail || '', preferenceRank: rank >= 0 ? rank + 1 : 99,
                        round: 0, expertiseMatch: 0, isReserve: 'Promoted', status: 'Pending'
                    };
                    updated = [...updated, newRow];
                }

                if (isConfigured) {
                    setIsSaving(true);
                    try {
                        const rowUpdates = [{
                            match: { studentEmail: alloc.studentEmail, practicalId: String(alloc.practicalId), isReserve: alloc.isReserve },
                            values: { status: 'Removed' }
                        }];
                        if (replacement && replacement.reserveRow) {
                            rowUpdates.push({
                                match: { studentEmail: replacement.reserveRow.studentEmail, practicalId: String(alloc.practicalId), isReserve: 'Yes' },
                                values: { isReserve: 'Promoted', status: 'Pending' }
                            });
                        }
                        const res = await SheetsAPI.updateRows('Allocations', rowUpdates);
                        if (!res || res.error || res.success === false) throw new Error('row update failed: ' + (res && res.error || 'no response'));
                        if (newRow) {
                            const ap = await SheetsAPI.append('Allocations', newRow);
                            if (!ap || ap.error || ap.success === false) throw new Error('adding replacement failed: ' + (ap && ap.error || 'no response'));
                        }
                        if (replacement) {
                            await SheetsAPI.request('notifyPromotedReserve', 'Allocations', {
                                studentEmail: replacement.email, studentName: replacement.name,
                                practicalId: String(alloc.practicalId),
                                practicalName: alloc.practicalName, practicalDate: alloc.practicalDate,
                                courseCode: alloc.courseCode, convenorEmail: alloc.convenorEmail
                            });
                        }
                    } catch (e) {
                        console.error('Reassign failed:', e);
                        setIsSaving(false);
                        alert('The change could not be saved to Google Sheets. Nothing has been emailed. Reload and try again.');
                        await loadFromSheets();
                        return null;
                    }
                    setIsSaving(false);
                }
                setAllocations(updated);

                let autoEmailed = false;
                if (isConfigured) {
                    const n = await SheetsAPI.request('notifyAllocationChange', 'Allocations', {
                        studentEmail: alloc.studentEmail, practicalId: String(alloc.practicalId),
                        replacementEmail: replacement ? replacement.email : null, reason
                    });
                    autoEmailed = !!(n && n.success);
                    if (!autoEmailed) console.warn('notifyAllocationChange failed:', n && n.error);
                }

                const when = fmt(alloc.practicalDate);
                const course = alloc.courseCode ? ` (${alloc.courseCode})` : '';
                const convBody = replacement
                    ? `Dear convenor,\n\nA change to your GTAs for ${alloc.practicalName}${course} on ${when}: ${alloc.studentName} will no longer be demonstrating, and ${replacement.name} (${replacement.email}) is taking their place. ${replacement.name} has been asked to confirm.${why}\n\nBest wishes,\nTony`
                    : `Dear convenor,\n\nA change to your GTAs for ${alloc.practicalName}${course} on ${when}: ${alloc.studentName} will no longer be demonstrating. I haven't been able to find a replacement yet, so you are one GTA short for now.${why}\n\nBest wishes,\nTony`;
                const studBody = `Dear ${alloc.studentName},\n\nI've removed you from ${alloc.practicalName}${course} on ${when}, so you no longer need to attend that session. Your other allocations are unchanged.${why}\n\nBest wishes,\nTony`;
                const mailto = (to, subject, body) => `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
                return {
                    autoEmailed,
                    replacementName: replacement ? replacement.name : null,
                    convenorMailto: alloc.convenorEmail ? mailto(alloc.convenorEmail, `GTA change: ${alloc.practicalName} ${when}`, convBody) : null,
                    studentMailto: mailto(alloc.studentEmail, `GTA allocation change: ${alloc.practicalName} ${when}`, studBody)
                };
            };

            // Confirm/Decline allocation functions
            const confirmAllocation = async (allocation) => {
                const updatedAllocations = allocations.map(a => {
                    if (a.studentEmail === allocation.studentEmail && String(a.practicalId) === String(allocation.practicalId)) {
                        return { ...a, status: 'Confirmed' };
                    }
                    return a;
                });
                
                if (isConfigured) {
                    setIsSaving(true);
                    // Update only this student's own row - not the whole sheet, so a
                    // stale tab can't undo other students' confirms/declines made since
                    // this page loaded. Matches the row's actual isReserve value, so
                    // promoted reserves ('Promoted') can confirm too.
                    const ok = await SheetsAPI.updateRowsVerified('Allocations', [{
                        match: {
                            studentEmail: allocation.studentEmail,
                            practicalId: String(allocation.practicalId),
                            isReserve: allocation.isReserve || 'No'
                        },
                        values: { status: 'Confirmed' }
                    }]);
                    setIsSaving(false);
                    if (!ok) {
                        alert(`Sorry - your confirmation for "${allocation.practicalName}" could not be saved (a temporary problem connecting to Google). Please try again in a minute, or email ${'t.southall@imperial.ac.uk'} if it keeps failing.`);
                        return;
                    }
                }
                setAllocations(updatedAllocations);
                alert(`Thank you - "${allocation.practicalName}" is confirmed.`);
            };

            const declineAllocation = async (allocation) => {
                if (!confirm(`Are you sure you want to decline "${allocation.practicalName}"? A reserve GTA will be contacted to take your place.`)) {
                    return;
                }
                
                // Find a reserve for this practical to promote
                const reserve = allocations.find(a => 
                    String(a.practicalId) === String(allocation.practicalId) && 
                    a.isReserve === 'Yes' && 
                    (!a.status || a.status === 'Pending')
                );
                
                // Update allocations
                const updatedAllocations = allocations.map(a => {
                    // Mark declined allocation
                    if (a.studentEmail === allocation.studentEmail && String(a.practicalId) === String(allocation.practicalId) && a.isReserve !== 'Yes') {
                        return { ...a, status: 'Declined' };
                    }
                    // Promote reserve if found
                    if (reserve && a.studentEmail === reserve.studentEmail && String(a.practicalId) === String(reserve.practicalId) && a.isReserve === 'Yes') {
                        return { ...a, isReserve: 'Promoted', status: 'Pending' };
                    }
                    return a;
                });
                
                setAllocations(updatedAllocations);
                
                if (isConfigured) {
                    setIsSaving(true);
                    // Update only the two rows actually affected (the declining
                    // student's row, and the promoted reserve's row if any) - not
                    // the whole sheet, so a stale tab can't undo other students'
                    // confirms/declines/promotions made since this page loaded.
                    const rowUpdates = [{
                        match: {
                            studentEmail: allocation.studentEmail,
                            practicalId: String(allocation.practicalId),
                            isReserve: allocation.isReserve || 'No'
                        },
                        values: { status: 'Declined' }
                    }];
                    if (reserve) {
                        rowUpdates.push({
                            match: {
                                studentEmail: reserve.studentEmail,
                                practicalId: String(reserve.practicalId),
                                isReserve: 'Yes'
                            },
                            values: { isReserve: 'Promoted', status: 'Pending' }
                        });
                    }
                    const saved = await SheetsAPI.updateRowsVerified('Allocations', rowUpdates);
                    if (!saved) {
                        setIsSaving(false);
                        alert(`Sorry - your decline for "${allocation.practicalName}" could not be saved (a temporary problem connecting to Google). Please try again in a minute.`);
                        await loadFromSheets();
                        return;
                    }
                    
                    // Notify reserve if one was promoted
                    if (reserve) {
                        await SheetsAPI.request('notifyPromotedReserve', 'Allocations', {
                            practicalId: String(allocation.practicalId),
                            studentEmail: reserve.studentEmail,
                            studentName: reserve.studentName,
                            practicalName: allocation.practicalName,
                            practicalDate: allocation.practicalDate,
                            courseCode: allocation.courseCode,
                            convenorEmail: allocation.convenorEmail
                        });
                    }
                    
                    // Notify convenor of the decline
                    await SheetsAPI.request('notifyConvenorDecline', 'Allocations', {
                        convenorEmail: allocation.convenorEmail,
                        studentName: allocation.studentName,
                        practicalName: allocation.practicalName,
                        reserveName: reserve?.studentName || null
                    });
                    
                    setIsSaving(false);
                }
                
                if (reserve) {
                    alert(`You have declined this allocation. ${reserve.studentName} (reserve) has been notified to take your place.`);
                } else {
                    alert('You have declined this allocation. The convenor has been notified.');
                }
            };

            // Check URL for confirm/decline actions on page load
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const action = params.get('action');
                const email = params.get('email');
                const practicalId = params.get('practical');
                
                if (action && email && practicalId && allocations.length > 0) {
                    const allocation = allocations.find(a => 
                        a.studentEmail?.toLowerCase() === email.toLowerCase() && 
                        String(a.practicalId) === String(practicalId) &&
                        a.isReserve !== 'Yes' && a.status !== 'Removed'
                    );
                    
                    if (allocation) {
                        setStudentEmail(email);
                        setView('student');
                        
                        // Clear URL params
                        window.history.replaceState({}, '', window.location.pathname);
                        
                        if (action === 'confirm') {
                            setTimeout(() => confirmAllocation(allocation), 500);
                        } else if (action === 'decline') {
                            setTimeout(() => declineAllocation(allocation), 500);
                        }
                    }
                }
            }, [allocations]);







            // Shared state + handlers handed to the top-level views.
            // A fresh object each render is fine: it re-renders the views,
            // it does not remount them, so their own state survives.
            const ctx = {
                view, setView, isAdminAuthenticated, setIsAdminAuthenticated,
                isDPSAuthenticated, setIsDPSAuthenticated, studentName, setStudentName,
                studentEmail, setStudentEmail, studentExpertise, setStudentExpertise,
                studentMaxSessions, setStudentMaxSessions, studentDepartment,
                setStudentDepartment, studentIsMature, setStudentIsMature, studentOpenToOthers, setStudentOpenToOthers, vetoList,
                setVetoList, ratings, setRatings, practicals, setPracticals, preferences,
                setPreferences, submissions, setSubmissions, allocations, setAllocations,
                maxSlotsPerStudent, setMaxSlotsPerStudent, expertiseTags, setExpertiseTags,
                isLoading, setIsLoading, isOnline, lastSync, isSaving, setIsSaving,
                isConfigured, loadFromSheets, addPractical, deletePractical, updatePractical,
                submitPreferences, runAllocation, exportAllocations, clearAllocations,
                previewAllocations, previewMeta, commitAllocation, discardPreview,
                clearSubmissions, clearPracticals, clearAllData, confirmAllocation,
                declineAllocation, getAdminPassword, getDPSPassword, sessionMinutes,
                formatHours, calculateTotalDuration, formatTime, reassignAllocation, fillSlot
            };

            if (isLoading && isConfigured) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <RefreshCw className="animate-spin mx-auto mb-4 text-purple-600" size={40} />
                            <p className="text-gray-600">Loading data from Google Sheets...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    <ConnectionStatus ctx={ctx} />
                    <div className="bg-white shadow-sm border-b">
                        <div className="max-w-6xl mx-auto px-6 py-4">
                            <div className="flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-gray-800">Imperial DoLS GTA Allocator</h1>
                                <div className="flex flex-wrap gap-2 justify-end">
                                    <button
                                        onClick={() => setView('student')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'student' 
                                                ? 'bg-blue-600 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Users size={20} className="mr-2" />
                                        Student View
                                    </button>
                                    <button
                                        onClick={() => setView('vacancies')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'vacancies'
                                                ? 'bg-green-600 text-white'
                                                : 'bg-green-100 text-green-800 hover:bg-green-200'
                                        }`}
                                    >
                                        Open GTA slots
                                        {(() => { const n = openSlotList(practicals, allocations).reduce((t, x) => t + x.short, 0);
                                                  return n > 0 ? <span className="ml-2 bg-white text-green-800 text-xs font-bold px-2 py-0.5 rounded-full">{n}</span> : null; })()}
                                    </button>
                                    <button
                                        onClick={() => setView('convenor')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'convenor' 
                                                ? 'bg-purple-600 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Settings size={20} className="mr-2" />
                                        Convenor View
                                    </button>
                                    <button
                                        onClick={() => setView('dps')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'dps' 
                                                ? 'bg-purple-800 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Settings size={20} className="mr-2" />
                                        DPS View
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {view === 'student' ? <StudentView ctx={ctx} /> : view === 'vacancies' ? <VacanciesView ctx={ctx} /> : view === 'convenor' ? <ConvenorView ctx={ctx} /> : <DPSView ctx={ctx} />}
                </div>
            );
        };

        ReactDOM.render(<GTAAllocator />, document.getElementById('root'));
    </script>
</body>
</html>
