<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial DoLS GTA Allocator</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============ CONFIGURATION ============
        // Only the Web App URL is needed - no API key exposed!
        const CONFIG = {
            // Your deployed Google Apps Script Web App URL
            // This is safe to be public - the script controls access
            WEB_APP_URL: 'https://script.google.com/macros/s/AKfycbyuJnhGfxj2uE1EomVOWQy0wh-h0j4S5gfPTCi7pEK6rlSoFP3eGujTGa9z-uhWJvsi/exec'
        };

        // Google Sheets API via Apps Script (secure - no API key needed)
        const SheetsAPI = {
            async request(action, sheetName, data = null) {
                if (CONFIG.WEB_APP_URL === 'YOUR_WEB_APP_URL_HERE') {
                    console.log('Web App URL not configured');
                    return null;
                }
                
                try {
                    const response = await fetch(CONFIG.WEB_APP_URL, {
                        method: 'POST',
                        mode: 'cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify({ action, sheetName, data }),
                        redirect: 'follow'
                    });
                    
                    const result = await response.json();
                    return result;
                } catch (error) {
                    console.error('API Error:', error);
                    return null;
                }
            },
            
            async read(sheetName) {
                const result = await this.request('read', sheetName);
                return result?.data || [];
            },
            
            async append(sheetName, rowData) {
                return this.request('append', sheetName, rowData);
            },
            
            async update(sheetName, allData) {
                return this.request('update', sheetName, allData);
            },
            
            async deleteRow(sheetName, id) {
                return this.request('delete', sheetName, { id });
            }
        };

        // Lucide icons as SVG components
        const Calendar = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        );

        const Users = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
        );

        const Settings = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        );

        const CheckCircle = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );

        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );

        const Download = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );
        
        const RefreshCw = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );
        
        const Cloud = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
            </svg>
        );

        const VetoPanel = ({ vetoList, setVetoList }) => {
            const [vs, setVs] = React.useState('');
            const [vc, setVc] = React.useState('');
            const [vr, setVr] = React.useState('');
            return (
                <>
                    <div className="grid grid-cols-3 gap-3 mb-3">
                        <div>
                            <label className="block text-xs font-medium mb-1">Student Email</label>
                            <input type="email" value={vs} onChange={e => setVs(e.target.value)} className="w-full p-2 border rounded text-sm" placeholder="student@imperial.ac.uk" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium mb-1">Convenor Email</label>
                            <input type="email" value={vc} onChange={e => setVc(e.target.value)} className="w-full p-2 border rounded text-sm" placeholder="convenor@imperial.ac.uk" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium mb-1">Reason (optional)</label>
                            <input type="text" value={vr} onChange={e => setVr(e.target.value)} className="w-full p-2 border rounded text-sm" placeholder="e.g. supervisory relationship" />
                        </div>
                    </div>
                    <button onClick={() => {
                        if (!vs || !vc) { alert('Please enter both emails.'); return; }
                        setVetoList([...vetoList, { id: Date.now().toString(), studentEmail: vs, convenorEmail: vc, reason: vr }]);
                        setVs(''); setVc(''); setVr('');
                    }} className="bg-red-600 text-white px-4 py-2 rounded text-sm hover:bg-red-700 mb-4">Add Veto</button>
                    {vetoList.length > 0 && (
                        <div className="space-y-2">
                            <p className="text-sm font-medium">Active vetoes ({vetoList.length}):</p>
                            {vetoList.map(v => (
                                <div key={v.id} className="flex items-center justify-between p-2 bg-red-50 border border-red-200 rounded text-sm">
                                    <span>🚫 <strong>{v.studentEmail}</strong> — <strong>{v.convenorEmail}</strong>{v.reason ? ` (${v.reason})` : ''}</span>
                                    <button onClick={() => setVetoList(vetoList.filter(x => x.id !== v.id))} className="text-red-600 hover:text-red-800 font-bold ml-3">✕</button>
                                </div>
                            ))}
                        </div>
                    )}
                </>
            );
        };

        const RatingPanel = ({ confirmedAllocs, studentEmail, ratings, setRatings, isConfigured }) => {
            const [pid, setPid] = React.useState('');
            const [score, setScore] = React.useState(0);
            const [comment, setComment] = React.useState('');
            const alreadyRated = (id) => ratings.some(r => r.studentEmail === studentEmail && r.practicalId === id);
            const submit = async () => {
                if (!pid || score === 0) { alert('Please select a practical and rating.'); return; }
                const nr = { id: Date.now().toString(), studentEmail, practicalId: pid, rating: score, comment, timestamp: new Date().toISOString() };
                setRatings([...ratings, nr]);
                if (isConfigured) await window._SheetsAPI.append('Ratings', nr);
                setPid(''); setScore(0); setComment('');
                alert('Thank you for your feedback!');
            };
            return (
                <div className="bg-white rounded-lg shadow-md p-6 mt-6">
                    <h3 className="text-xl font-semibold mb-2">⭐ Rate Your GTA Experience</h3>
                    <p className="text-sm text-gray-500 mb-4">Once you have completed a practical, please rate your experience.</p>
                    <div className="mb-3">
                        <label className="block text-sm font-medium mb-1">Select Practical</label>
                        <select value={pid} onChange={e => setPid(e.target.value)} className="w-full p-2 border rounded">
                            <option value="">-- Choose a completed practical --</option>
                            {confirmedAllocs.map(a => (
                                <option key={a.practicalId} value={a.practicalId} disabled={alreadyRated(a.practicalId)}>
                                    {a.practicalName}{alreadyRated(a.practicalId) ? ' ✓ Already rated' : ''}
                                </option>
                            ))}
                        </select>
                    </div>
                    <div className="mb-3">
                        <label className="block text-sm font-medium mb-1">Rating</label>
                        <div className="flex gap-2">
                            {[1,2,3,4,5].map(s => (
                                <button key={s} onClick={() => setScore(s)} className={`text-2xl ${score >= s ? 'text-yellow-400' : 'text-gray-300'}`}>★</button>
                            ))}
                            {score > 0 && <span className="text-sm text-gray-500 self-center ml-2">{['','Poor','Fair','Good','Very good','Excellent'][score]}</span>}
                        </div>
                    </div>
                    <div className="mb-3">
                        <label className="block text-sm font-medium mb-1">Comments (optional)</label>
                        <textarea value={comment} onChange={e => setComment(e.target.value)} className="w-full p-2 border rounded text-sm" rows={3} placeholder="Any comments..." />
                    </div>
                    <button onClick={submit} disabled={!pid || score === 0} className="bg-yellow-500 text-white px-5 py-2 rounded hover:bg-yellow-600 disabled:opacity-40 disabled:cursor-not-allowed">Submit Rating</button>
                </div>
            );
        };

        window._SheetsAPI = SheetsAPI;

        const GTAAllocator = () => {
            const [view, setView] = useState('student');
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [studentName, setStudentName] = useState('');
            const [studentEmail, setStudentEmail] = useState('');
            const [studentExpertise, setStudentExpertise] = useState([]);
            const [studentMaxSessions, setStudentMaxSessions] = useState(3);
            const [studentDepartment, setStudentDepartment] = useState('Life Sciences');
            const [studentIsMature, setStudentIsMature] = useState(false);
            const [studentIsSpecialised, setStudentIsSpecialised] = useState(false);
            const [studentSpecialisedJustification, setStudentSpecialisedJustification] = useState('');
            const [vetoList, setVetoList] = useState([]);
            const [ratings, setRatings] = useState([]);
            const [practicals, setPracticals] = useState([]);
            const [preferences, setPreferences] = useState([]);
            const [submissions, setSubmissions] = useState([]);
            const [allocations, setAllocations] = useState([]);
            const [maxSlotsPerStudent, setMaxSlotsPerStudent] = useState(3);
            const [expertiseTags, setExpertiseTags] = useState([
                'eukaryotic cell culture wet lab work', 'molecular biology wet lab work',
                'microbiology lab work', 'ecology',
                'evolutionary biology', 'statistics and programming (e.g. Python and R)',
                'maths support', 'widening access support activities',
                'developmental biology', 'Drosophila',
                'fluorescence microscopy'
            ]);
            const [isLoading, setIsLoading] = useState(true);
            const [isOnline, setIsOnline] = useState(false);
            const [lastSync, setLastSync] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            
            const getAdminPassword = () => atob('==QNyAjMTBFR'.split('').reverse().join(''));

            // Check if configured
            const isConfigured = CONFIG.WEB_APP_URL !== 'YOUR_WEB_APP_URL_HERE';

            // Load data from Google Sheets
            const loadFromSheets = async () => {
                if (!isConfigured) {
                    setIsLoading(false);
                    return;
                }
                
                setIsLoading(true);
                try {
                    const [practicalsData, submissionsData, allocationsData] = await Promise.all([
                        SheetsAPI.read('Practicals'),
                        SheetsAPI.read('Submissions'),
                        SheetsAPI.read('Allocations')
                    ]);
                    
                    // Convert practicals data
                    const convertedPracticals = (practicalsData || []).map(p => ({
                        ...p,
                        id: p.id || Date.now().toString(),
                        slots: parseInt(p.slots) || 5,
                        tags: p.tags ? p.tags.split(',').map(t => t.trim()).filter(t => t) : []
                    }));
                    
                    // Convert submissions data  
                    const convertedSubmissions = (submissionsData || []).map(s => {
                        let prefs = [];
                        if (Array.isArray(s.preferences)) {
                            prefs = s.preferences;
                        } else if (typeof s.preferences === 'string' && s.preferences) {
                            prefs = s.preferences.split(',').map(t => t.trim());
                        } else if (s.preferences) {
                            prefs = [String(s.preferences)];
                        }
                        
                        let exp = [];
                        if (Array.isArray(s.expertise)) {
                            exp = s.expertise;
                        } else if (typeof s.expertise === 'string' && s.expertise) {
                            exp = s.expertise.split(',').map(t => t.trim());
                        } else if (s.expertise) {
                            exp = [String(s.expertise)];
                        }
                        
                        return {
                            ...s,
                            id: s.id || Date.now().toString(),
                            preferences: prefs,
                            expertise: exp,
                            maxSessions: parseInt(s.maxSessions) || 3,
                            previousHours: parseInt(s.previousHours) || 0
                        };
                    });
                    
                    // Convert allocations data
                    const convertedAllocations = (allocationsData || []).map(a => ({
                        ...a,
                        preferenceRank: parseInt(a.preferenceRank) || 1,
                        round: parseInt(a.round) || 1,
                        expertiseMatch: parseInt(a.expertiseMatch) || 0
                    }));
                    
                    setPracticals(convertedPracticals);
                    setSubmissions(convertedSubmissions);
                    setAllocations(convertedAllocations);
                    setIsOnline(true);
                    setLastSync(new Date());
                } catch (error) {
                    console.error('Error loading from sheets:', error);
                    setIsOnline(false);
                }
                setIsLoading(false);
            };

            useEffect(() => {
                loadFromSheets();
            }, []);

            // Save practical to Google Sheets
            const addPractical = async (practical) => {
                const newPractical = {
                    ...practical,
                    id: Date.now().toString(),
                    deadline: practical.deadline || practical.date,
                    tags: practical.tags || [],
                    documentUrl: practical.documentUrl || '',
                    convenorEmail: practical.convenorEmail || '',
                    teachingStaff: practical.teachingStaff || ''
                };
                
                // Optimistic update
                const newPracticals = [...practicals, newPractical];
                setPracticals(newPracticals);
                
                if (isConfigured) {
                    setIsSaving(true);
                    const rowData = {
                        id: newPractical.id,
                        name: newPractical.name,
                        courseCode: newPractical.courseCode || '',
                        date: newPractical.date,
                        deadline: newPractical.deadline,
                        slots: newPractical.slots,
                        tags: newPractical.tags.join(', '),
                        documentUrl: newPractical.documentUrl || '',
                        convenorEmail: newPractical.convenorEmail || '',
                        teachingStaff: newPractical.teachingStaff || ''
                    };
                    await SheetsAPI.append('Practicals', rowData);
                    setIsSaving(false);
                }
            };

            const deletePractical = async (id) => {
                const newPracticals = practicals.filter(p => p.id !== id);
                setPracticals(newPracticals);
                
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.deleteRow('Practicals', id);
                    setIsSaving(false);
                }
            };

            const updatePractical = async (updatedPractical) => {
                const newPracticals = practicals.map(p => 
                    p.id === updatedPractical.id ? updatedPractical : p
                );
                setPracticals(newPracticals);
                
                if (isConfigured) {
                    setIsSaving(true);
                    const allData = newPracticals.map(p => ({
                        id: p.id,
                        name: p.name,
                        courseCode: p.courseCode || '',
                        date: p.date,
                        deadline: p.deadline || p.date,
                        slots: p.slots,
                        tags: Array.isArray(p.tags) ? p.tags.join(', ') : p.tags,
                        documentUrl: p.documentUrl || '',
                        convenorEmail: p.convenorEmail || '',
                        teachingStaff: p.teachingStaff || ''
                    }));
                    await SheetsAPI.update('Practicals', allData);
                    setIsSaving(false);
                }
            };

            const submitPreferences = async () => {
                if (!studentName || !studentEmail || preferences.length === 0) {
                    alert('Please fill in your name, email, and select at least one preference');
                    return;
                }

                if (studentExpertise.length === 0) {
                    alert('Please select at least one area of expertise/interest');
                    return;
                }

                const submission = {
                    id: Date.now().toString(),
                    name: studentName,
                    email: studentEmail,
                    preferences: preferences,
                    expertise: studentExpertise,
                    maxSessions: studentMaxSessions,
                    timestamp: new Date().toISOString(),
                    previousHours: 0,
                    department: studentDepartment,
                    isMature: studentIsMature ? 'Yes' : 'No',
                    isSpecialised: studentIsSpecialised ? 'Yes' : 'No',
                    specialisedJustification: studentIsSpecialised ? studentSpecialisedJustification : ''
                };

                // Optimistic update
                const newSubmissions = [...submissions, submission];
                setSubmissions(newSubmissions);
                
                if (isConfigured) {
                    setIsSaving(true);
                    const rowData = {
                        id: submission.id,
                        name: submission.name,
                        email: submission.email,
                        preferences: submission.preferences.join(', '),
                        expertise: submission.expertise.join(', '),
                        maxSessions: submission.maxSessions,
                        timestamp: submission.timestamp,
                        previousHours: submission.previousHours,
                        department: submission.department,
                        isMature: submission.isMature,
                        isSpecialised: submission.isSpecialised,
                        specialisedJustification: submission.specialisedJustification
                    };
                    await SheetsAPI.append('Submissions', rowData);
                    setIsSaving(false);
                }
                
                setPreferences([]);
                setStudentExpertise([]);
                setStudentMaxSessions(3);
                setStudentDepartment('Life Sciences');
                setStudentIsMature(false);
                setStudentIsSpecialised(false);
                setStudentSpecialisedJustification('');
                alert('Your preferences have been submitted successfully!');
            };

            const runAllocation = async () => {
                const results = [];
                const studentAllocations = {};
                const practicalFills = {};
                const reserveCount = 2; // Number of reserve GTAs per practical
                
                practicals.forEach(p => { practicalFills[p.id] = 0; });
                submissions.forEach(s => { studentAllocations[s.email] = 0; });

                const sortedStudents = [...submissions].sort((a, b) => 
                    (a.previousHours || 0) - (b.previousHours || 0)
                );

                // Main allocation rounds
                for (let round = 1; round <= maxSlotsPerStudent; round++) {
                    for (const student of sortedStudents) {
                        // Respect student's own max sessions preference
                        const studentMax = student.maxSessions || maxSlotsPerStudent;
                        if (studentAllocations[student.email] >= round) continue;
                        if (studentAllocations[student.email] >= studentMax) continue;
                        
                        for (let prefIdx = 0; prefIdx < student.preferences.length; prefIdx++) {
                            const practicalId = student.preferences[prefIdx];
                            const practical = practicals.find(p => p.id === practicalId);
                            
                            if (!practical) continue;
                            if (practicalFills[practicalId] >= practical.slots) continue;
                            
                            const alreadyAllocated = results.some(
                                r => r.studentEmail === student.email && r.practicalId === practicalId
                            );
                            if (alreadyAllocated) continue;

                            // Veto check
                            const isVetoed = vetoList.some(v =>
                                v.studentEmail.toLowerCase() === student.email.toLowerCase() &&
                                v.convenorEmail.toLowerCase() === (practical.convenorEmail || '').toLowerCase()
                            );
                            if (isVetoed) continue;

                            // Non-Life-Sci: only allocate if slots remain after Life Sci students
                            if (student.department && student.department !== 'Life Sciences') {
                                const lifeSciWanted = sortedStudents.filter(s =>
                                    (s.department === 'Life Sciences' || !s.department) &&
                                    s.preferences.includes(practicalId) &&
                                    studentAllocations[s.email] < (s.maxSessions || maxSlotsPerStudent)
                                ).length;
                                if (lifeSciWanted >= (practical.slots - practicalFills[practicalId])) continue;
                            }

                            let expertiseMatch = 0;
                            if (practical.tags && student.expertise) {
                                const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                                const studentExpertise = Array.isArray(student.expertise) ? student.expertise : [];
                                expertiseMatch = practicalTags.filter(t => 
                                    studentExpertise.includes(t)
                                ).length;
                            }

                            results.push({
                                studentName: student.name,
                                studentEmail: student.email,
                                practicalId: practicalId,
                                practicalName: practical.name,
                                practicalDate: practical.date,
                                courseCode: practical.courseCode || '',
                                convenorEmail: practical.convenorEmail || '',
                                preferenceRank: prefIdx + 1,
                                round: round,
                                expertiseMatch: expertiseMatch,
                                isReserve: 'No',
                                status: 'Pending'
                            });

                            studentAllocations[student.email]++;
                            practicalFills[practicalId]++;
                            break;
                        }
                    }
                }

                // Reserve allocation - find students who wanted each practical but didn't get it
                for (const practical of practicals) {
                    let reserveFilled = 0;
                    
                    // Get students who selected this practical but weren't allocated to it
                    const interestedStudents = sortedStudents.filter(student => {
                        const wantedThis = student.preferences.includes(practical.id);
                        const alreadyGotThis = results.some(
                            r => r.studentEmail === student.email && r.practicalId === practical.id && r.isReserve === 'No'
                        );
                        return wantedThis && !alreadyGotThis;
                    });

                    // Sort by preference rank for this practical (those who ranked it higher get reserve priority)
                    interestedStudents.sort((a, b) => {
                        const aRank = a.preferences.indexOf(practical.id);
                        const bRank = b.preferences.indexOf(practical.id);
                        return aRank - bRank;
                    });

                    // Allocate reserves
                    for (const student of interestedStudents) {
                        if (reserveFilled >= reserveCount) break;

                        const prefIdx = student.preferences.indexOf(practical.id);
                        let expertiseMatch = 0;
                        if (practical.tags && student.expertise) {
                            const practicalTags = Array.isArray(practical.tags) ? practical.tags : [];
                            const studentExpertise = Array.isArray(student.expertise) ? student.expertise : [];
                            expertiseMatch = practicalTags.filter(t => 
                                studentExpertise.includes(t)
                            ).length;
                        }

                        results.push({
                            studentName: student.name,
                            studentEmail: student.email,
                            practicalId: practical.id,
                            practicalName: practical.name,
                            practicalDate: practical.date,
                            courseCode: practical.courseCode || '',
                            convenorEmail: practical.convenorEmail || '',
                            preferenceRank: prefIdx + 1,
                            round: 0,
                            expertiseMatch: expertiseMatch,
                            isReserve: 'Yes',
                            status: ''
                        });

                        reserveFilled++;
                    }
                }

                setAllocations(results);
                
                // Save to Google Sheets
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', results);
                    
                    // Trigger convenor emails
                    await SheetsAPI.request('sendConvenorEmails', 'Allocations', null);
                    
                    setIsSaving(false);
                }
                
                const mainAllocations = results.filter(r => r.isReserve === 'No');
                const reserveAllocations = results.filter(r => r.isReserve === 'Yes');
                alert(`Allocation complete! ${mainAllocations.length} main slots and ${reserveAllocations.length} reserve slots allocated.`);
            };

            const exportAllocations = () => {
                const csv = [
                    ['Student Name', 'Email', 'Practical', 'Course Code', 'Date', 'Preference Rank', 'Round', 'Expertise Match', 'Reserve', 'Status', 'Convenor Email'].join(','),
                    ...allocations.map(a => [
                        a.studentName,
                        a.studentEmail,
                        a.practicalName,
                        a.courseCode || '',
                        a.practicalDate,
                        a.preferenceRank,
                        a.round,
                        a.expertiseMatch || 0,
                        a.isReserve || 'No',
                        a.status || 'Pending',
                        a.convenorEmail || ''
                    ].join(','))
                ].join('\n');

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'gta-allocations.csv';
                a.click();
            };

            const clearAllocations = async () => {
                if (!confirm('Are you sure you want to clear ALL allocations? This cannot be undone.')) return;
                
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('Allocations cleared successfully.');
            };

            const clearSubmissions = async () => {
                if (!confirm('Are you sure you want to clear ALL student submissions? This cannot be undone.')) return;
                
                setSubmissions([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Submissions', []);
                    setIsSaving(false);
                }
                alert('Submissions cleared successfully.');
            };

            const clearPracticals = async () => {
                if (!confirm('Are you sure you want to clear ALL practicals? This will also clear submissions and allocations. This cannot be undone.')) return;
                
                setPracticals([]);
                setSubmissions([]);
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Practicals', []);
                    await SheetsAPI.update('Submissions', []);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('All practicals, submissions, and allocations cleared successfully.');
            };

            const clearAllData = async () => {
                if (!confirm('⚠️ WARNING: This will delete ALL data (practicals, submissions, and allocations). Are you absolutely sure?')) return;
                if (!confirm('This is your last chance to cancel. Click OK to permanently delete all data.')) return;
                
                setPracticals([]);
                setSubmissions([]);
                setAllocations([]);
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Practicals', []);
                    await SheetsAPI.update('Submissions', []);
                    await SheetsAPI.update('Allocations', []);
                    setIsSaving(false);
                }
                alert('All data has been cleared.');
            };

            // Confirm/Decline allocation functions
            const confirmAllocation = async (allocation) => {
                const updatedAllocations = allocations.map(a => {
                    if (a.studentEmail === allocation.studentEmail && a.practicalId === allocation.practicalId) {
                        return { ...a, status: 'Confirmed' };
                    }
                    return a;
                });
                
                setAllocations(updatedAllocations);
                
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', updatedAllocations);
                    setIsSaving(false);
                }
                
                alert('Thank you for confirming your allocation!');
            };

            const declineAllocation = async (allocation) => {
                if (!confirm(`Are you sure you want to decline "${allocation.practicalName}"? A reserve GTA will be contacted to take your place.`)) {
                    return;
                }
                
                // Find a reserve for this practical to promote
                const reserve = allocations.find(a => 
                    a.practicalId === allocation.practicalId && 
                    a.isReserve === 'Yes' && 
                    (!a.status || a.status === 'Pending')
                );
                
                // Update allocations
                const updatedAllocations = allocations.map(a => {
                    // Mark declined allocation
                    if (a.studentEmail === allocation.studentEmail && a.practicalId === allocation.practicalId && a.isReserve !== 'Yes') {
                        return { ...a, status: 'Declined' };
                    }
                    // Promote reserve if found
                    if (reserve && a.studentEmail === reserve.studentEmail && a.practicalId === reserve.practicalId && a.isReserve === 'Yes') {
                        return { ...a, isReserve: 'Promoted', status: 'Pending' };
                    }
                    return a;
                });
                
                setAllocations(updatedAllocations);
                
                if (isConfigured) {
                    setIsSaving(true);
                    await SheetsAPI.update('Allocations', updatedAllocations);
                    
                    // Notify reserve if one was promoted
                    if (reserve) {
                        await SheetsAPI.request('notifyPromotedReserve', 'Allocations', {
                            studentEmail: reserve.studentEmail,
                            studentName: reserve.studentName,
                            practicalName: allocation.practicalName,
                            practicalDate: allocation.practicalDate,
                            courseCode: allocation.courseCode,
                            convenorEmail: allocation.convenorEmail
                        });
                    }
                    
                    // Notify convenor of the decline
                    await SheetsAPI.request('notifyConvenorDecline', 'Allocations', {
                        convenorEmail: allocation.convenorEmail,
                        studentName: allocation.studentName,
                        practicalName: allocation.practicalName,
                        reserveName: reserve?.studentName || null
                    });
                    
                    setIsSaving(false);
                }
                
                if (reserve) {
                    alert(`You have declined this allocation. ${reserve.studentName} (reserve) has been notified to take your place.`);
                } else {
                    alert('You have declined this allocation. The convenor has been notified.');
                }
            };

            // Check URL for confirm/decline actions on page load
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const action = params.get('action');
                const email = params.get('email');
                const practicalId = params.get('practical');
                
                if (action && email && practicalId && allocations.length > 0) {
                    const allocation = allocations.find(a => 
                        a.studentEmail?.toLowerCase() === email.toLowerCase() && 
                        a.practicalId === practicalId &&
                        a.isReserve !== 'Yes'

                        setView('student');
                        
                        // Clear URL params

                        if (action === 'confirm') {
                            setTimeout(() => confirmAllocation(allocation), 500);

                                               className="text-blue-600 font-bold hover:underline text-lg">
                                                rebecca.lewis1@imperial.ac.uk

                                                ✓ I understand, continue

                                </p>

                        {availablePracticals.length > 0 ? (

                        </div>

                        <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                            <h3 className="text-xl font-semibold mb-2">🚫 Veto Management</h3>
                            <p className="text-sm text-gray-500 mb-4">Prevent a specific student from being allocated to a specific convenor's practicals.</p>
                            <VetoPanel vetoList={vetoList} setVetoList={setVetoList} />
                        </div>

                        {ratings.length > 0 && (
                            <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                                <h3 className="text-xl font-semibold mb-2">⭐ GTA Ratings</h3>
                                <div className="space-y-2 max-h-64 overflow-y-auto">
                                    {ratings.map((r, idx) => {
                                        const practical = practicals.find(p => p.id === r.practicalId);
                                        return (
                                            <div key={idx} className="p-3 bg-yellow-50 border border-yellow-200 rounded text-sm">
                                                <div className="flex items-center justify-between">
                                                    <span className="font-medium">{r.studentEmail}</span>
                                                    <span className="text-yellow-500">{'★'.repeat(r.rating)}{'☆'.repeat(5-r.rating)}</span>
                                                </div>
                                                <div className="text-gray-600">{practical?.name || r.practicalId} • {new Date(r.timestamp).toLocaleDateString()}</div>
                                                {r.comment && <div className="text-gray-700 mt-1 italic">"{r.comment}"</div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-lg shadow-md p-6 mb-6">
                            <h3 className="text-xl font-semibold mb-4">Run Allocation</h3>
                            <div className="bg-amber-50 border border-amber-300 rounded-lg p-4 mb-4">
                                <div className="flex items-start gap-2">
                                    <span className="text-amber-600 text-xl">⚠️</span>
                                    <div>
                                        <p className="font-medium text-amber-800">Before running the allocation:</p>
                                        <ul className="text-sm text-amber-700 mt-1 list-disc list-inside">
                                            <li>Ensure <strong>all practicals for the term</strong> have been added</li>
                                            <li>Check that signup deadlines have passed</li>
                                            <li>Coordinate with DPS before running - allocations should typically be run centrally</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <p className="text-gray-600 mb-4">
                                This will allocate students to practicals based on their preferences and expertise match.
                            </p>
                            <button
                                onClick={runAllocation}
                                disabled={isSaving || submissions.length === 0}
                                className="bg-green-600 text-white px-6 py-3 rounded font-medium hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {isSaving ? 'Running...' : 'Run Fair Allocation Algorithm'}
                            </button>
                            
                            {allocations.length > 0 && (
                                <button
                                    onClick={async () => {
                                        if (!confirm('Send allocation emails to all students with confirm/decline links?')) return;
                                        setIsSaving(true);
                                        const result = await SheetsAPI.request('sendAllocationEmails', 'Allocations', null);
                                        setIsSaving(false);
                                        if (result?.emailsSent) {
                                            alert(`Sent ${result.emailsSent} allocation email(s) to students.`);
                                        } else {
                                            alert('No new emails to send (students may have already been emailed).');
                                        }
                                    }}
                                    disabled={isSaving}
                                    className="ml-4 bg-blue-600 text-white px-6 py-3 rounded font-medium hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                    {isSaving ? 'Sending...' : '📧 Send Allocation Emails'}
                                </button>
                            )}
                        </div>

                        {allocations.length > 0 && (
                            <div className="bg-white rounded-lg shadow-md p-6">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-xl font-semibold">Allocation Results ({allocations.filter(a => a.isReserve !== 'Yes').length} main + {allocations.filter(a => a.isReserve === 'Yes').length} reserves)</h3>
                                    <button
                                        onClick={exportAllocations}
                                        className="flex items-center bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
                                    >
                                        <Download size={20} className="mr-2" />
                                        Export CSV
                                    </button>
                                </div>
                                
                                <div className="grid grid-cols-4 gap-4 mb-4 p-4 bg-gray-50 rounded">
                                    <div>
                                        <div className="text-2xl font-bold text-blue-600">
                                            {new Set(allocations.filter(a => a.isReserve !== 'Yes').map(a => a.studentEmail)).size}
                                        </div>
                                        <div className="text-sm text-gray-600">Students allocated</div>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-bold text-orange-600">
                                            {new Set(allocations.filter(a => a.isReserve === 'Yes').map(a => a.studentEmail)).size}
                                        </div>
                                        <div className="text-sm text-gray-600">Reserve students</div>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-bold text-green-600">
                                            {allocations.filter(a => a.isReserve !== 'Yes').length > 0 ? (allocations.filter(a => a.isReserve !== 'Yes').reduce((sum, a) => sum + (a.preferenceRank === 1 ? 1 : 0), 0) / allocations.filter(a => a.isReserve !== 'Yes').length * 100).toFixed(0) : 0}%
                                        </div>
                                        <div className="text-sm text-gray-600">Got 1st choice</div>
                                    </div>
                                    <div>
                                        <div className="text-2xl font-bold text-purple-600">
                                            {submissions.length > 0 ? (allocations.filter(a => a.isReserve !== 'Yes').length / submissions.length).toFixed(1) : 0}
                                        </div>
                                        <div className="text-sm text-gray-600">Avg slots per student</div>
                                    </div>
                                </div>

                                <div className="space-y-2 max-h-96 overflow-y-auto">
                                    {allocations.map((alloc, idx) => (
                                        <div key={idx} className={`p-3 border rounded ${
                                            alloc.status === 'Declined' ? 'bg-red-50 border-red-200' :
                                            alloc.status === 'Confirmed' ? 'bg-green-100 border-green-400' :
                                            alloc.isReserve === 'Yes' ? 'bg-orange-50 border-orange-200' : 
                                            alloc.isReserve === 'Promoted' ? 'bg-blue-50 border-blue-200' :
                                            'bg-green-50 border-green-200'
                                        }`}>
                                            <div className="flex justify-between">
                                                <div>
                                                    {alloc.isReserve === 'Yes' && <span className="text-orange-600 font-medium mr-2">[RESERVE]</span>}
                                                    {alloc.isReserve === 'Promoted' && <span className="text-blue-600 font-medium mr-2">[PROMOTED]</span>}
                                                    {alloc.status === 'Declined' && <span className="text-red-600 font-medium mr-2">[DECLINED]</span>}
                                                    <span className="font-medium">{alloc.studentName}</span>
                                                    <span className="text-gray-600 ml-2">→ {alloc.practicalName}</span>
                                                    {alloc.courseCode && <span className="text-purple-600 ml-2">({alloc.courseCode})</span>}
                                                </div>
                                                <div className="text-sm flex items-center gap-2">
                                                    {alloc.status === 'Confirmed' && <span className="bg-green-600 text-white px-2 py-0.5 rounded text-xs">✓ Confirmed</span>}
                                                    {alloc.status === 'Pending' && <span className="bg-yellow-500 text-white px-2 py-0.5 rounded text-xs">⏳ Pending</span>}
                                                    {!alloc.status && alloc.isReserve !== 'Yes' && <span className="bg-gray-400 text-white px-2 py-0.5 rounded text-xs">Not emailed</span>}
                                                    <span className="text-gray-600">
                                                        Pref #{alloc.preferenceRank} {alloc.isReserve !== 'Yes' && alloc.isReserve !== 'Promoted' && `• R${alloc.round}`}
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Data Management Section */}
                        <div className="bg-white rounded-lg shadow-md p-6">
                            <h3 className="text-xl font-semibold mb-4">🗑️ Data Management</h3>
                            <p className="text-gray-600 mb-4">Use these buttons to clear data. All actions require confirmation.</p>
                            
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="text-center">
                                    <button
                                        onClick={clearAllocations}
                                        disabled={isSaving || allocations.length === 0}
                                        className="w-full bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        Clear Allocations
                                    </button>
                                    <p className="text-xs text-gray-500 mt-1">{allocations.length} records</p>
                                </div>
                                
                                <div className="text-center">
                                    <button
                                        onClick={clearSubmissions}
                                        disabled={isSaving || submissions.length === 0}
                                        className="w-full bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        Clear Submissions
                                    </button>
                                    <p className="text-xs text-gray-500 mt-1">{submissions.length} records</p>
                                </div>
                                
                                <div className="text-center">
                                    <button
                                        onClick={clearPracticals}
                                        disabled={isSaving || practicals.length === 0}
                                        className="w-full bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        Clear Practicals
                                    </button>
                                    <p className="text-xs text-gray-500 mt-1">{practicals.length} records</p>
                                </div>
                                
                                <div className="text-center">
                                    <button
                                        onClick={clearAllData}
                                        disabled={isSaving || (practicals.length === 0 && submissions.length === 0 && allocations.length === 0)}
                                        className="w-full bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        ⚠️ Clear ALL Data
                                    </button>
                                    <p className="text-xs text-gray-500 mt-1">Everything</p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            if (isLoading && isConfigured) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <RefreshCw className="animate-spin mx-auto mb-4 text-purple-600" size={40} />
                            <p className="text-gray-600">Loading data from Google Sheets...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    <ConnectionStatus />
                    <div className="bg-white shadow-sm border-b">
                        <div className="max-w-6xl mx-auto px-6 py-4">
                            <div className="flex justify-between items-center">
                                <h1 className="text-2xl font-bold text-gray-800">Imperial DoLS GTA Allocator</h1>
                                <div className="flex space-x-2">
                                    <button
                                        onClick={() => setView('student')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'student' 
                                                ? 'bg-blue-600 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Users size={20} className="mr-2" />
                                        Student View
                                    </button>
                                    <button
                                        onClick={() => setView('admin')}
                                        className={`px-4 py-2 rounded flex items-center ${
                                            view === 'admin' 
                                                ? 'bg-purple-600 text-white' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        <Settings size={20} className="mr-2" />
                                        Admin View
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {view === 'student' ? <StudentView /> : <AdminView />}
                </div>
            );
        };

        ReactDOM.render(<GTAAllocator />, document.getElementById('root'));
    </script>
</body>
</html>
